<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"/>
<meta name="author" content="Lê Bảo Tú - Trường Tiểu học Huỳnh Ngọc Huệ">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Phi thuyền vũ trụ — Trường Tiểu học Huỳnh Ngọc Huệ</title>
<style>:root {
  --bg0: #060a18;
  --bg1: #0e1733;
  --bg2: #18264d;
  --accent: #5ce1ff;
  --accent2: #ff6bd6;
  --gold: #ffd76a;
  --green: #5dff9a;
  --red: #ff6b7a;
  --purple: #a78bfa;
  --card: rgba(18, 28, 58, 0.72);
  --card-solid: rgba(22, 34, 68, 0.92);
  --border: rgba(130, 220, 255, 0.42);
  --text: #f4f7ff;
  --muted: #a7b8d8;
  --radius: 18px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --glow: 0 0 24px rgba(92, 225, 255, 0.28);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background:
    radial-gradient(ellipse 120% 70% at 50% -10%, rgba(92,225,255,0.18), transparent 55%),
    radial-gradient(ellipse 80% 50% at 100% 20%, rgba(255,107,214,0.12), transparent 50%),
    radial-gradient(ellipse at top, #152047 0%, var(--bg0) 58%);
  color: var(--text);
  min-height: 100%;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}
body.stars::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(2px 2px at 20px 30px, #fff, transparent),
    radial-gradient(1px 1px at 80px 120px, #fff, transparent),
    radial-gradient(2px 2px at 160px 80px, #9cf, transparent),
    radial-gradient(1px 1px at 240px 200px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 320px 40px, #fcf, transparent),
    radial-gradient(1px 1px at 400px 160px, #fff, transparent),
    radial-gradient(2px 2px at 480px 90px, #fff, transparent),
    radial-gradient(1px 1px at 560px 220px, #9cf, transparent);
  background-size: 600px 260px;
  opacity: 0.55;
  animation: twinkle 8s linear infinite;
}
@keyframes twinkle { to { background-position: 600px 0; } }

.wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 20px; }
.wrap-wide { max-width: 1280px; }

h1, h2, h3 { font-weight: 800; letter-spacing: 0.02em; }
h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }
.subtitle { color: var(--muted); margin-top: 6px; }

.logo {
  display: flex; align-items: center; gap: 12px; justify-content: center;
  margin-bottom: 8px;
}
.logo-emoji { font-size: 2.4rem; filter: drop-shadow(0 0 12px #5ce1ff); }

.card {
  background: linear-gradient(160deg, rgba(36,52,96,0.78), rgba(14,22,48,0.82));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08), var(--glow);
  margin-bottom: 16px;
}

.btn {
  appearance: none; border: none; cursor: pointer;
  font-family: inherit; font-weight: 800; font-size: 1rem;
  padding: 13px 22px; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent), #3b82f6);
  color: #041018; transition: transform .15s, filter .15s, box-shadow .15s;
  box-shadow: 0 6px 22px rgba(92,225,255,0.4);
  min-height: 46px;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-pink { background: linear-gradient(135deg, var(--accent2), #c084fc); color: #1a0420; box-shadow: 0 6px 20px rgba(255,107,214,0.35); }
.btn-gold { background: linear-gradient(135deg, var(--gold), #f59e0b); color: #2a1a00; }
.btn-green { background: linear-gradient(135deg, var(--green), #22c55e); color: #04210f; }
.btn-ghost {
  background: rgba(255,255,255,0.04); color: var(--text);
  border: 1.5px solid var(--border); box-shadow: none;
}
.btn-ghost.btn-green, .btn.shape-btn.btn-green {
  background: linear-gradient(135deg, rgba(93,255,154,0.25), rgba(92,225,255,0.2));
  border-color: var(--green);
  color: #eafff3;
  box-shadow: 0 0 0 2px rgba(93,255,154,0.25), 0 0 18px rgba(93,255,154,0.2);
}
.shape-btn {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 48px; padding: 10px 14px;
}
.shape-btn canvas { flex: none; }
.btn-lg { font-size: 1.15rem; padding: 16px 28px; }
.btn-block { width: 100%; display: block; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

label { display: block; font-weight: 700; margin: 10px 0 6px; color: var(--accent); }
textarea, input[type=text], input[type=number], select {
  width: 100%; font-family: inherit; font-size: 1rem;
  background: rgba(7,11,26,0.7); color: var(--text);
  border: 1.5px solid var(--border); border-radius: 12px;
  padding: 10px 12px; outline: none;
}
textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(92,225,255,0.2); }
textarea { min-height: 120px; resize: vertical; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(92,225,255,0.12); border: 1px solid var(--border);
  padding: 4px 12px; border-radius: 999px; font-size: 0.9rem; font-weight: 700;
}
.pill-warn { background: rgba(255,215,106,0.15); border-color: rgba(255,215,106,0.4); color: var(--gold); }
.pill-hot { background: rgba(255,107,214,0.15); border-color: rgba(255,107,214,0.45); color: var(--accent2); }

.hidden { display: none !important; }
.center { text-align: center; }
.mt { margin-top: 12px; }
.mb { margin-bottom: 12px; }

/* Landing */
.hero { text-align: center; padding: 40px 12px 20px; }
.hero p { max-width: 520px; margin: 12px auto 28px; color: var(--muted); line-height: 1.5; }
.role-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 720px; margin: 0 auto; }
@media (max-width: 600px) { .role-cards { grid-template-columns: 1fr; } }
.role-card {
  text-decoration: none; color: inherit; display: block;
  padding: 28px 20px; border-radius: 20px;
  background: linear-gradient(160deg, rgba(26,39,73,0.95), rgba(10,14,30,0.95));
  border: 2px solid var(--border); transition: transform .2s, border-color .2s;
}
.role-card:hover { transform: translateY(-4px); border-color: var(--accent); }
.role-card .ico { font-size: 3rem; margin-bottom: 8px; }
.role-card h2 { margin-bottom: 6px; }

/* Host lobby */
.lobby-layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; align-items: start; }
@media (max-width: 860px) { .lobby-layout { grid-template-columns: 1fr; } }
.room-code {
  font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 900; letter-spacing: 0.2em;
  color: var(--gold); text-shadow: 0 0 24px rgba(255,215,106,0.5);
}
#qrBox {
  background: #fff; border-radius: 16px; padding: 12px;
  display: inline-block; margin: 10px auto;
}
#qrBox canvas, #qrBox img { display: block; width: min(62vh, 80vw, 460px); height: auto; image-rendering: pixelated; }
.player-list { list-style: none; max-height: 280px; overflow: auto; }
.player-list li {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.ship-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; }

/* Live race */
.live-header {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.timer-big {
  font-size: 2rem; font-weight: 900; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.timer-big.hot { color: var(--accent2); animation: pulse 0.8s ease infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

#raceCanvas {
  width: 100%; height: 280px; display: block;
  border-radius: 16px; background: #050814;
  border: 1px solid var(--border);
}
.board {
  width: 100%; border-collapse: collapse; font-size: 0.95rem;
}
.board th, .board td { padding: 8px 10px; text-align: left; }
.board th { color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--border); }
.board tr:nth-child(even) td { background: rgba(255,255,255,0.03); }
.bar {
  height: 10px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden;
}
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

/* Podium */
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 12px; min-height: 200px; margin: 20px 0; }
.podium .p {
  width: 110px; text-align: center; border-radius: 14px 14px 8px 8px;
  padding: 12px 8px 8px; background: var(--bg2); border: 1px solid var(--border);
}
.podium .p .place { font-size: 1.6rem; }
.podium .p1 { height: 180px; background: linear-gradient(180deg, rgba(255,215,106,0.35), var(--bg2)); border-color: var(--gold); order: 2; }
.podium .p2 { height: 140px; background: linear-gradient(180deg, rgba(192,210,240,0.3), var(--bg2)); order: 1; }
.podium .p3 { height: 110px; background: linear-gradient(180deg, rgba(205,127,50,0.3), var(--bg2)); order: 3; }

.tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 800;
  background: transparent; border: 1px solid var(--border); color: var(--text); font-family: inherit;
}
.tab.active { background: var(--accent); color: #041018; border-color: transparent; }

.wrong-q { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.wrong-q .meta { color: var(--red); font-weight: 800; font-size: 0.9rem; }

/* Student phone */
body.student {
  background: linear-gradient(180deg, #0a1230 0%, #070b1a 40%, #12081f 100%);
  overflow: hidden;
}
.phone {
  height: 100dvh; max-height: 100vh; display: flex; flex-direction: column;
  max-width: 480px; margin: 0 auto; padding: 8px; gap: 8px;
}
.phone-top {
  flex: 1 1 52%; min-height: 220px; position: relative;
  border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
  background: #050814;
}
#shipCanvas { width: 100%; height: 100%; display: block; }
.hud {
  position: absolute; top: 8px; left: 8px; right: 8px;
  display: flex; justify-content: space-between; gap: 6px; pointer-events: none;
}
.hud .pill { pointer-events: none; font-size: 0.8rem; background: rgba(0,0,0,0.45); }
.steer {
  position: absolute; bottom: 8px; left: 0; right: 0;
  display: flex; justify-content: space-between; padding: 0 10px; gap: 10px;
}
.steer button {
  width: 72px; height: 72px; border-radius: 50%; border: none;
  font-size: 1.8rem; font-weight: 900; cursor: pointer;
  background: rgba(92,225,255,0.25); color: #fff; border: 2px solid var(--accent);
  backdrop-filter: blur(4px); touch-action: manipulation; user-select: none;
}
.steer button:active { background: rgba(92,225,255,0.55); }

.phone-bottom {
  flex: 1 1 48%; min-height: 200px;
  display: flex; flex-direction: column; gap: 8px;
}
.q-box {
  flex: 1; display: flex; flex-direction: column; gap: 8px;
  background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px;
}
.q-text { font-weight: 800; font-size: 1.05rem; line-height: 1.35; flex: 0 0 auto; }
.answers {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1;
}
.ans {
  border: none; border-radius: 14px; padding: 12px 10px; font-family: inherit;
  font-weight: 800; font-size: 0.95rem; cursor: pointer; color: #fff;
  touch-action: manipulation; min-height: 64px; text-align: left;
  display: flex; align-items: flex-start; gap: 8px;
}
.ans .letter {
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px;
  background: rgba(0,0,0,0.25); display: grid; place-items: center; font-weight: 900;
}
.ans-a { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
.ans-b { background: linear-gradient(135deg, #22c55e, #15803d); }
.ans-c { background: linear-gradient(135deg, #f59e0b, #b45309); }
.ans-d { background: linear-gradient(135deg, #ec4899, #9d174d); }
.ans:disabled { opacity: 0.55; }
.ans.correct-flash { outline: 3px solid var(--green); }
.ans.wrong-flash { outline: 3px solid var(--red); }

.feedback {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(0,0,0,0.55); font-size: 1.6rem; font-weight: 900;
  z-index: 5; text-align: center; padding: 20px; animation: pop .3s ease;
}
@keyframes pop { from { transform: scale(0.8); opacity: 0; } }
.waiting-msg {
  flex: 1; display: grid; place-items: center; text-align: center;
  color: var(--muted); padding: 20px; font-weight: 700;
}

.ship-preview {
  width: 120px; height: 120px; margin: 8px auto; border-radius: 16px;
  background: #050814; border: 1px solid var(--border); display: grid; place-items: center;
  font-size: 2.4rem;
}
.color-row { display: flex; flex-wrap: wrap; gap: 8px; }
.color-swatch {
  width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; cursor: pointer;
  box-shadow: inset 0 -2px 6px rgba(0,0,0,0.25);
}
.color-swatch.active { border-color: #fff; box-shadow: 0 0 0 3px var(--accent), 0 0 16px rgba(92,225,255,0.45); transform: scale(1.06); }
.ship-ico { display: inline-block; border-radius: 8px; background: rgba(5,8,20,0.55); }
.ans { font-size: 1rem !important; min-height: 72px !important; }
.steer button { width: 78px !important; height: 78px !important; }
@media (max-width: 720px) {
  .wrap { padding: 12px; }
  .card { padding: 14px 14px; }
  .btn { width: 100%; justify-content: center; }
  .btn-row .btn { width: auto; flex: 1 1 auto; }
  #raceCanvas { height: 200px; }
  .lobby-layout { gap: 12px; }
  .room-code { letter-spacing: 0.12em; }
}
@media (min-width: 1100px) {
  #raceCanvas { height: 320px; }
  .wrap-wide { max-width: 1360px; }
}

.status-bar {
  font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px;
}
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(10,14,30,0.95); border: 1px solid var(--border);
  padding: 10px 16px; border-radius: 12px; z-index: 99; font-weight: 700;
  max-width: 90vw;
}

.meteor-banner {
  background: linear-gradient(90deg, var(--accent2), var(--gold));
  color: #1a0420; font-weight: 900; text-align: center; padding: 8px;
  border-radius: 12px; margin-bottom: 10px; animation: pulse 1s ease infinite;
}

.help-box {
  font-size: 0.9rem; color: var(--muted); line-height: 1.45;
  background: rgba(0,0,0,0.25); border-radius: 12px; padding: 10px 12px;
}
.help-box code {
  background: rgba(92,225,255,0.12); padding: 1px 6px; border-radius: 6px; color: var(--accent);
}

.lesson-list { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 12px; padding: 6px; margin-top: 6px; }
.lesson-item { display: flex !important; align-items: center; gap: 8px; padding: 6px 4px; color: var(--text) !important; font-weight: 700; cursor: pointer; margin: 0 !important; }
.lesson-item input { width: 20px; height: 20px; flex: none; }
.lesson-item i { color: var(--muted); font-style: normal; font-weight: 600; }
details.adv { border: 1px dashed var(--border); border-radius: 12px; padding: 8px 12px; }
details.adv summary { cursor: pointer; color: var(--muted); font-weight: 700; }

/* —— School identity: Trường Tiểu học Huỳnh Ngọc Huệ —— */
.school-brand {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin: 0 auto 14px; max-width: 640px; text-align: left;
}
.school-brand.compact { gap: 10px; margin-bottom: 10px; }
.school-logo {
  width: 72px; height: 72px; object-fit: contain; flex: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.96);
  box-shadow:
    0 0 0 2px rgba(92,225,255,0.55),
    0 0 22px rgba(92,225,255,0.35),
    0 8px 24px rgba(0,0,0,0.45);
}
.school-brand.compact .school-logo { width: 52px; height: 52px; }
.school-brand-text { min-width: 0; }
.school-name {
  font-weight: 900; font-size: clamp(0.78rem, 2.2vw, 1.05rem);
  letter-spacing: 0.04em; color: #fff;
  text-shadow: 0 0 18px rgba(92,225,255,0.45);
  line-height: 1.25;
}
.school-place {
  margin-top: 2px; font-size: 0.78rem; font-weight: 700;
  color: var(--gold); letter-spacing: 0.02em;
}
.school-mark {
  display: inline-flex; align-items: center; gap: 8px;
  margin: 0 auto 10px;
}
.school-mark img {
  width: 36px; height: 36px; border-radius: 50%; object-fit: contain;
  background: rgba(255,255,255,0.95);
  box-shadow: 0 0 0 1.5px rgba(92,225,255,0.5), 0 0 12px rgba(92,225,255,0.25);
}
.school-mark span {
  font-size: 0.72rem; font-weight: 800; color: var(--muted);
  letter-spacing: 0.03em; text-transform: uppercase;
}
.school-footer {
  text-align: center; margin-top: 22px; padding: 10px 12px 4px;
  font-size: 0.78rem; font-weight: 700; color: var(--muted);
  border-top: 1px solid rgba(130,220,255,0.18);
}
.school-footer strong { color: var(--accent); font-weight: 800; }
.hero .school-brand { margin-bottom: 18px; }
.lobby-school {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-bottom: 12px;
}
.lobby-school img {
  width: 56px; height: 56px; border-radius: 50%; object-fit: contain;
  background: rgba(255,255,255,0.96);
  box-shadow: 0 0 0 2px rgba(92,225,255,0.5), 0 0 18px rgba(92,225,255,0.3);
}
.lobby-school .school-name { font-size: 0.95rem; }
.race-wrap { position: relative; }
.race-school-badge {
  position: absolute; top: 10px; right: 12px; z-index: 2;
  width: 44px; height: 44px; border-radius: 50%; object-fit: contain;
  background: rgba(255,255,255,0.92);
  box-shadow: 0 0 0 1.5px rgba(92,225,255,0.45), 0 4px 14px rgba(0,0,0,0.35);
  pointer-events: none; opacity: 0.92;
}
@media (max-width: 720px) {
  .school-brand { gap: 10px; }
  .school-logo { width: 58px; height: 58px; }
  .school-name { font-size: 0.78rem; }
  .race-school-badge { width: 34px; height: 34px; top: 8px; right: 8px; }
}
@media (min-width: 1100px) {
  .school-logo { width: 84px; height: 84px; }
  .lobby-school img { width: 64px; height: 64px; }
  .race-school-badge { width: 52px; height: 52px; }
}

/* Discreet opening-screen attribution and responsive school address. */
.school-place{white-space:normal;line-height:1.5;text-wrap:balance}
.welcome-author{margin:20px auto 0;padding:12px 10px 0;border-top:1px solid #76d9ff30;color:#a6b5ce;font-size:12px;line-height:1.6;text-align:center;max-width:650px}.welcome-author strong{color:#b9e8f5;font-weight:600}
@media(max-width:600px){.welcome-author{font-size:11px}.school-place{letter-spacing:0}}

/* Single-line school address, balanced on small screens. */
.school-brand-text{min-width:0}
.school-place{white-space:nowrap;text-wrap:nowrap;font-size:clamp(9px,2.6vw,14px);letter-spacing:0;line-height:1.45}

i máy tính\", \"Một loại phần cứng\", \"Một trình duyệt\"],\n    correct: 1\n  },\n  {\n    id: 14,\n    text: \"Em nên làm gì khi nhận tin nhắn lạ yêu cầu mật khẩu?\",\n    options: [\"Gửi mật khẩu ngay\", \"Bỏ qua / Báo người lớn\", \"Bấm vào mọi liên kết\", \"Chia sẻ cho bạn bè\"],\n    correct: 1\n  },\n  {\n    id: 15,\n    text: \"Thư mục (folder) dùng để làm gì?\",\n    options: [\"Chơi game\", \"Sắp xếp và chứa tệp\", \"Kết nối Internet\", \"In ấn\"],\n    correct: 1\n  }\n];\n\nwindow.QUESTION_IMPORT = {\n  /**\n   * Định dạng văn bản đơn giản (mỗi câu):\n   * Câu hỏi?\n   * A. đáp án\n   * B. đáp án\n   * C. đáp án *\n   * D. đáp án\n   * (dòng trống giữa các câu)\n   * Dấu * hoặc dòng \"Đáp án: C\" đánh dấu đúng.\n   */\n  parseText(raw) {\n    const blocks = raw.replace(/\\r\\n/g, \"\\n\").trim().split(/\\n\\s*\\n+/);\n    const out = [];\n    let id = 1;\n    for (const block of blocks) {\n      const lines = block.split(\"\\n\").map((l) => l.trim()).filter(Boolean);\n      if (lines.length < 5) continue;\n      let text = lines[0].replace(/^\\d+[\\).\\]]\\s*/, \"\");\n      const opts = [];\n      let correct = -1;\n      let explicit = null;\n      for (let i = 1; i < lines.length; i++) {\n        const line = lines[i];\n        const mAns = line.match(/^Đáp\\s*án\\s*[:：]\\s*([A-Da-d])/i);\n        if (mAns) {\n          explicit = mAns[1].toUpperCase().charCodeAt(0) - 65;\n          continue;\n        }\n        const m = line.match(/^([A-Da-d])[\\).\\:\\-]\\s*(.+)$/);\n        if (m) {\n          let opt = m[2].trim();\n          const starred = /\\*\\s*$/.test(opt) || /\\(đúng\\)/i.test(opt);\n          opt = opt.replace(/\\s*\\*\\s*$/, \"\").replace(/\\s*\\(đúng\\)\\s*/i, \"\").trim();\n          if (starred) correct = opts.length;\n          opts.push(opt);\n        }\n      }\n      if (explicit !== null) correct = explicit;\n      if (opts.length === 4 && correct >= 0 && correct < 4) {\n        out.push({ id: id++, text, options: opts, correct });\n      }\n    }\n    return out;\n  },\n\n  parseCSV(raw) {\n    const lines = raw.replace(/\\r\\n/g, \"\\n\").trim().split(\"\\n\");\n    const out = [];\n    let id = 1;\n    for (const line of lines) {\n      if (!line.trim() || /^câu hỏi/i.test(line)) continue;\n      const cols = line.split(\",\").map((c) => c.trim().replace(/^\"|\"$/g, \"\"));\n      if (cols.length < 6) continue;\n      const correctLetter = cols[5].toUpperCase();\n      const correct = correctLetter.charCodeAt(0) - 65;\n      if (correct < 0 || correct > 3) continue;\n      out.push({\n        id: id++,\n        text: cols[0],\n        options: [cols[1], cols[2], cols[3], cols[4]],\n        correct\n      });\n    }\n    return out;\n  },\n\n  parseJSON(raw) {\n    const data = JSON.parse(raw);\n    const arr = Array.isArray(data) ? data : data.questions || [];\n    return arr.map((q, i) => ({\n      id: q.id || i + 1,\n      text: q.text || q.question,\n      options: q.options || [q.A, q.B, q.C, q.D],\n      correct: typeof q.correct === \"number\" ? q.correct : \"ABCD\".indexOf(String(q.correct).toUpperCase())\n    }));\n  }\n};\n\n// Ngân hàng câu hỏi theo bài học — Kết nối tri thức, lớp 3–5. Mở rộng 08/11/2026.\nwindow.SGK_PRESETS = {\"lop3\": {\"name\": \"Tin học 3 (Kết nối tri thức)\", \"lessons\": [{\"id\": \"bai1\", \"title\": \"Bài 1. Thông tin và quyết định\", \"questions\": [{\"text\": \"Có ba dạng thông tin thường gặp. Đó là những dạng nào?\", \"options\": [\"Hình ảnh, nóng, lạnh\", \"Âm thanh, mùi hương, chữ\", \"Chữ, mùi vị, màu sắc\", \"Chữ, hình ảnh, âm thanh\"], \"correct\": 3}, {\"text\": \"Tiếng chuông báo thức mỗi sáng là thông tin giúp bạn Minh quyết định điều gì?\", \"options\": [\"Đi ngủ tiếp\", \"Đi đá bóng\", \"Xem ti vi\", \"Thức dậy, chuẩn bị đi học\"], \"correct\": 3}, {\"text\": \"Trời mưa, Khoa đưa áo mưa cho mẹ. Câu nào là THÔNG TIN?\", \"options\": [\"Khoa đưa áo mưa cho mẹ\", \"Mẹ mặc áo mưa\", \"Trời mưa\", \"Khoa đi học\"], \"correct\": 2}, {\"text\":  b); x.classList.toggle(\"btn-ghost\", x !== b); });\n    refreshQCount();\n  });\n  PT.qs(\"#bankAll\").onclick = () => { const g = window.SGK_PRESETS[bank.grade]; bank.custom = null; bank.lessons = new Set(g.lessons.map((x) => x.id)); renderLessons(); refreshQCount(); };\n  PT.qs(\"#bankNone\").onclick = () => { bank.custom = null; bank.lessons = new Set(); renderLessons(); refreshQCount(); };\n  function setCustom(qs, name) {\n    if (!qs || !qs.length) { PT.toast(\"Không tìm thấy câu hỏi trong file\"); return; }\n    bank.custom = qs; bank.customName = name; PT.qs(\"#customInfo\").textContent = `Đang dùng ${qs.length} câu từ \"${name}\"`;\n    refreshQCount(); PT.toast(`Đã nạp ${qs.length} câu từ ${name}`);\n  }\n  function parseRaw(raw) {\n    raw = raw.trim(); if (!raw) return [];\n    try { if (raw.startsWith(\"[\") || raw.startsWith(\"{\")) return window.QUESTION_IMPORT.parseJSON(raw); } catch (_) {}\n    if (raw.includes(\",\") && raw.split(\"\\n\")[0].split(\",\").length >= 6) return window.QUESTION_IMPORT.parseCSV(raw);\n    return window.QUESTION_IMPORT.parseText(raw);\n  }\n  function loadMammoth() {\n    return window.mammoth ? Promise.resolve() : new Promise((res, rej) => {\n      const s = document.createElement(\"script\"); s.src = \"https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js\";\n      s.onload = res; s.onerror = () => rej(new Error(\"cần mạng để đọc DOCX\")); document.head.appendChild(s);\n    });\n  }\n  PT.qs(\"#btnSample\").onclick = () => setCustom(window.SAMPLE_QUESTIONS, \"Bộ mẫu Tin học\");\n  PT.qs(\"#btnClearQ\").onclick = () => { bank.custom = null; PT.qs(\"#customInfo\").textContent = \"\"; PT.qs(\"#qFile\").value = \"\"; refreshQCount(); };\n\n\n  function shipIconHtml(p, size) {\n    size = size || 28;\n    const color = (p && p.color) || \"#5ce1ff\";\n    const shape = (p && p.shape) || \"rocket\";\n    const id = \"shipico_\" + Math.random().toString(36).slice(2, 8);\n    setTimeout(() => {\n      const cv = document.getElementById(id);\n      if (!cv || !window.PT) return;\n      const c = cv.getContext(\"2d\");\n      c.clearRect(0, 0, size, size);\n      c.save(); c.translate(size / 2, size / 2 + 2); PT.drawShip(c, color, shape, size / 36); c.restore();\n    }, 0);\n    return `<canvas id=\"${id}\" class=\"ship-ico\" width=\"${size}\" height=\"${size}\" style=\"width:${size}px;height:${size}px;vertical-align:middle\"><\/canvas>`;\n  }\n  PT.qs(\"#btnSampleClass\").onclick = () => {\n    el.classList.value = [\n      \"Nguyễn Văn An\", \"Trần Thị Bình\", \"Lê Minh Châu\", \"Phạm Quốc Dũng\",\n      \"Hoàng Gia Hân\", \"Võ Bảo Ngọc\", \"Đặng Minh Khoa\", \"Bùi Khánh Linh\"\n    ].join(\"\\n\");\n  };\n\n  PT.qs(\"#qFile\").addEventListener(\"change\", async (e) => {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    try {\n      if (file.name.toLowerCase().endsWith(\".docx\")) {\n        await loadMammoth();\n        const result = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });\n        const tmp = document.createElement(\"div\"); tmp.innerHTML = result.value;\n        tmp.querySelectorAll(\"u\").forEach((u) => { u.textContent = u.textContent + \" *\"; });\n        document.body.appendChild(tmp); const text = tmp.innerText.replace(/\\n{3,}/g, \"\\n\\n\"); tmp.remove();\n        setCustom(window.QUESTION_IMPORT.parseText(text), file.name);\n      } else setCustom(parseRaw(await file.text()), file.name);\n    } catch (err) { console.error(err); PT.toast(\"Không đọc được file: \" + err.message); }\n  });\n\n  function readSettings() {\n    state.settings.gameSeconds = Math.max(60, (Number(el.gameMinutes.value) || 3) * 60);\n    state.settings.secPerQ = Math.max(10, Number(el.secPerQ.value) || 30);\n    state.settings.itemsOn = !!el.itemsOn.checked;\n    state.classNames = el.classList.value\n      .split(\"\\n\")\n      .map((s) => s.trim())\n      .filter(Boolean);\n  }\n\n  PT.qs(\"#btnCreateRoom\").onclick = () => {\n    refreshQCount();\n    readSettings();\n    if (!state.questions.length) {\n      PT.toast(\"Cần ít nhất 1 câu hỏi\");\n      return;\n    }\n    if (!state.classNames.length) {\n      PT.toast(\"Cần danh sách lớp\");\n      return;\n    }\n    createRoom();\n  };\n\n  PT.qs(\"#btnBackSetup\").onclick = () => {\n    if (state.peer) {\n      try { state.peer.destroy(); } catch (_) {}\n      try { state.peer.peer && state.peer.peer.destroy(); } catch (_) {}\n      state.peer = null;\n    }\n    state.conns = {};\n    state.players = {};\n    state.takenNames = new Set();\n    show(\"setupView\");\n  };\n\n  function createRoom() {\n    state.code = PT.genCode();\n    el.roomCode.textContent = state.code;\n    const url = PT.playUrl(state.code);\n    el.joinLink.href = url;\n    el.joinLink.textContent = url;\n    el.qrBox.innerHTML = \"\";\n    try {\n      const qr = qrcode(0, \"M\"); qr.addData(url); qr.make();\n      const n = qr.getModuleCount(), m = 3, cell = Math.max(8, Math.floor(720 / (n + 2 * m)));\n      const canvas = document.createElement(\"canvas\"); canvas.width = canvas.height = (n + 2 * m) * cell;\n      const c = canvas.getContext(\"2d\"); c.fillStyle = \"#fff\"; c.fillRect(0, 0, canvas.width, canvas.height); c.fillStyle = \"#000\";\n      for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) c.fillRect((k + m) * cell, (r + m) * cell, cell, cell);\n      canvas.id = \"qrCanvas\"; canvas.setAttribute(\"aria-label\", \"QR vào phòng\"); el.qrBox.appendChild(canvas);\n    } catch (err) { console.error(err); el.qrBox.textContent = \"QR lỗi — dùng link bên dưới\"; }\n    el.peerStatus.textContent = \"Đang mở phòng \" + state.code + \"…\";\n    el.btnStart.disabled = true;\n    state.phase = \"lobby\";\n    state.players = {};\n    state.takenNames = new Set();\n    state.conns = {};\n    show(\"lobbyView\");\n\n    const peerId = PT.roomId(state.code);\n    if (window.PTMock && window.PTMock.enabled()) {\n      const mock = window.PTMock.host(state.code);\n      state.peer = mock;\n      mock.onConnection = (conn) => setupConn(conn);\n      mock.onOpen = (id) => {\n        el.peerStatus.textContent = \"Phòng sẵn sàng (mock) · \" + id;\n        PT.toast(\"Phòng \" + state.code + \" đã mở (chế độ thử)\");\n      };\n      return;\n    }\n    const peer = new Peer(peerId, PT.peerOpts());\n    state.peer = peer;\n\n    peer.on(\"open\", (id) => {\n      el.peerStatus.textContent = \"Phòng sẵn sàng · Peer: \" + id;\n      PT.toast(\"Phòng \" + state.code + \" đã mở\");\n    });\n    peer.on(\"error\", (err) => {\n      console.error(err);\n      el.peerStatus.textContent = \"Lỗi PeerJS: \" + err.type + \" — thử tạo phòng lại\";\n      if (err.type === \"unavailable-id\") {\n        PT.toast(\"Mã phòng trùng, đang tạo mã mới…\");\n        setTimeout(createRoom, 400);\n      }\n    });\n    peer.on(\"connection\", (conn) => {\n      setupConn(conn);\n    });\n  }\n\n  function setupConn(conn) {\n    conn.on(\"open\", () => {\n      state.conns[conn.peer] = conn;\n      PT.send(conn, \"hello\", {\n        classNames: state.classNames,\n        taken: [...state.takenNames],\n        settings: state.settings,\n        phase: state.phase\n      });\n      if (state.phase === \"live\") {\n        PT.send(conn, \"gameState\", snapshot());\n      }\n    });\n    conn.on(\"data\", (msg) => onStudentMsg(conn, msg));\n    conn.on(\"close\", () => {\n      delete state.conns[conn.peer];\n      // keep player for reconnect by name? mark offline\n      const p = Object.values(state.players).find((x) => x.peerId === conn.peer);\n      if (p) p.online = false;\n      renderLobby();\n      renderLiveBoard();\n    });\n  }\n\n  function onStudentMsg(conn, msg) {\n    if (!msg || !msg.type) return;\n    const { type, payload } = msg;\n    if (type === \"join\") {\n      if (state.phase !== \"lobby\" && state.phase !== \"live\") {\n        PT.send(conn, \"error\", { message: \"Phòng đã kết thúc\" });\n        return;\n      }\n      const name = String(payload.name || \"\").trim();\n      if (!state.classNames.includes(name)) {\n        PT.send(conn, \"error\", { message: \"Tên không có trong danh sách lớp\" });\n        return;\n      }\n      // allow reclaim if same peer rejoining\n      const existing = Object.values(state.players).find((p) => p.name === name);\n      if (existing && existing.peerId !== conn.peer && existing.online) {\n        PT.send(conn, \"error\", { message: \"Tên đã được chọn\" });\n        return;\n      }\n      const id = existing ? existing.id : \"p_\" + Math.random().toString(36).slice(2, 9);\n      const player = existing || {\n        id,\n        name,\n        peerId: conn.peer,\n        color: payload.color || PT.COLORS[Object.keys(state.players).length % PT.COLORS.length],\n        shape: payload.shape || \"rocket\",\n        emoji: (PT.SHAPES.find((s) => s.id === payload.shape) || PT.SHAPES[0]).emoji,\n        score: 0,\n        correct: 0,\n        wrong: 0,\n        combo: 0,\n        progress: 0,\n        items: [],\n        shieldUntil: 0,\n        stunnedUntil: 0,\n        answering: false,\n        online: true,\n        wrongAnswers: []\n      };\n      player.peerId = conn.peer;\n      player.online = true;\n      player.color = payload.color || player.color;\n      player.shape = payload.shape || player.shape;\n      player.emoji = (PT.SHAPES.find((s) => s.id === player.shape) || PT.SHAPES[0]).emoji;\n      state.players[id] = player;\n      state.takenNames.add(name);\n      PT.send(conn, \"joined\", { playerId: id, player: publicPlayer(player) });\n      broadcastLobby();\n      renderLobby();\n      if (state.phase === \"live\") PT.send(conn, \"gameState\", snapshot());\n    } else if (type === \"answer\") {\n      handleAnswer(conn, payload);\n    } else if (type === \"useItem\") {\n      handleUseItem(conn, payload);\n    } else if (type === \"ping\") {\n      PT.send(conn, \"pong\", {});\n    }\n  }\n\n  function publicPlayer(p) {\n    return {\n      id: p.id, name: p.name, color: p.color, shape: p.shape, emoji: p.emoji,\n      score: p.score, correct: p.correct, wrong: p.wrong, combo: p.combo,\n      progress: p.progress, items: p.items, answering: p.answering,\n      online: p.online, shieldUntil: p.shieldUntil, stunnedUntil: p.stunnedUntil\n    };\n  }\n\n  function snapshot() {\n    return {\n      phase: state.phase,\n      code: state.code,\n      settings: state.settings,\n      qIndex: state.qIndex,\n      question: state.qIndex >= 0 ? sanitizeQ(state.questions[state.qIndex]) : null,\n      qDeadline: state.qDeadline,\n      gameEndsAt: state.gameEndsAt,\n      meteor: state.meteor,\n      players: Object.values(state.players).map(publicPlayer),\n      now: Date.now()\n    };\n  }\n\n  function sanitizeQ(q) {\n    if (!q) return null;\n    return { id: q.id, text: q.text, options: q.options, index: state.qIndex, total: state.questions.length };\n  }\n\n  function broadcastLobby() {\n    const taken = [...state.takenNames];\n    const players = Object.values(state.players).map(publicPlayer);\n    PT.broadcast(state.conns, \"lobby\", { taken, players, classNames: state.classNames });\n  }\n\n  function broadcastState() {\n    PT.broadcast(state.conns, \"gameState\", snapshot());\n  }\n\n  function renderLobby() {\n    const list = Object.values(state.players).filter((p) => p.online);\n    el.joinedCount.textContent = list.length;\n    el.playerList.innerHTML = list\n      .map(\n        (p) =>\n          `<li>${shipIconHtml(p, 26)} <b>${escapeHtml(p.name)}<\/b><\/li>`\n      )\n      .join(\"\");\n    el.btnStart.disabled = list.length < 1;\n    if (el.waitingHint) el.waitingHint.textContent = list.length\n      ? \"Sẵn sàng bắt đầu khi giáo viên nhấn nút.\"\n      : \"Chờ học sinh quét QR và chọn tên…\";\n  }\n\n  function escapeHtml(s) {\n    return String(s).replace(/[&<>\"']/g, (c) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\n  }\n\n  el.btnStart.onclick = () => startGame();\n\n  function startGame() {\n    state.questions = buildRound();\n    state.phase = \"live\";\n    state.qIndex = -1;\n    state.answersThisQ = {};\n    state.wrongStats = {};\n    state.meteor = false;\n    const now = Date.now();\n    state.gameEndsAt = now + state.settings.gameSeconds * 1000;\n    Object.values(state.players).forEach((p) => {\n      p.score = 0; p.correct = 0; p.wrong = 0; p.combo = 0;\n      p.progress = 0; p.items = []; p.shieldUntil = 0; p.stunnedUntil = 0;\n      p.answering = false; p.wrongAnswers = [];\n    });\n    show(\"liveView\");\n    el.liveRoom.textContent = \"Phòng \" + state.code;\n    el.meteorBanner.classList.add(\"hidden\");\n    el.currentQText.textContent = \"🚀 Phi thuyền đang bay tới cổng câu hỏi…\";\n    el.currentQOpts.innerHTML = \"\";\n    el.liveQInfo.textContent = \"Chuẩn bị\";\n    el.answerStat.textContent = \"Bay trong không gian…\";\n    broadcastState();\n    PT.broadcast(state.conns, \"gameStart\", snapshot());\n    clearTimeout(state.qTimer);\n    state.qTimer = setTimeout(() => nextQuestion(), state.flightGapMs);\n    clearInterval(state.tickTimer);\n    state.tickTimer = setInterval(tick, 250);\n    startRaceAnim();\n  }\n\n  function nextQuestion() {\n    state.qIndex++;\n    // Không lặp lại câu trong cùng một lượt: hết ngân hàng đã rút thì kết thúc\n    if (state.qIndex >= state.questions.length) {\n      endGame();\n      return;\n    }\n    if (Date.now() >= state.gameEndsAt) {\n      endGame();\n      return;\n    }\n    state.answersThisQ = {};\n    state.qDeadline = Date.now() + state.settings.secPerQ * 1000;\n    Object.values(state.players).forEach((p) => { p.answering = true; });\n    const q = state.questions[state.qIndex];\n    el.currentQText.textContent = q.text;\n    el.currentQOpts.innerHTML = q.options.map((o, i) => `<li>${\"ABCD\"[i]}. ${escapeHtml(o)}<\/li>`).join(\"\");\n    el.liveQInfo.textContent = `Câu ${state.qIndex + 1}/${state.questions.length}`;\n    el.answerStat.textContent = \"0 đã trả lời\";\n    PT.broadcast(state.conns, \"question\", {\n      question: sanitizeQ(q),\n      qDeadline: state.qDeadline,\n      meteor: state.meteor,\n      now: Date.now()\n    });\n    broadcastState();\n    clearTimeout(state.qTimer);\n    state.qTimer = setTimeout(() => resolveQuestion(), state.settings.secPerQ * 1000 + 200);\n  }\n\n  function handleAnswer(conn, payload) {\n    if (state.phase !== \"live\") return;\n    const player = Object.values(state.players).find((p) => p.peerId === conn.peer);\n    if (!player) return;\n    if (state.answersThisQ[player.id] !== undefined) return;\n    if (Date.now() > state.qDeadline + 500) return;\n    const choice = Number(payload.choice);\n    const q = state.questions[state.qIndex];\n    if (!q) return;\n    const correct = choice === q.correct;\n    const mult = state.meteor ? 2 : 1;\n    state.answersThisQ[player.id] = choice;\n    player.answering = false;\n\n    if (correct) {\n      player.correct++;\n      player.combo++;\n      const base = 100;\n      const timeLeft = Math.max(0, state.qDeadline - Date.now());\n      const speedBonus = Math.round((timeLeft / (state.settings.secPerQ * 1000)) * 50);\n      const gained = (base + speedBonus) * mult;\n      player.score += gained;\n      player.progress = Math.min(1, player.correct / Math.max(4, Math.ceil(state.questions.length * 0.5)));\n      // items\n      if (state.settings.itemsOn && PT.ITEMS[player.combo]) {\n        const item = PT.ITEMS[player.combo];\n        if (!player.items.includes(item.id)) {\n          player.items.push(item.id);\n          PT.send(conn, \"itemGain\", { item });\n        }\n      }\n      PT.send(conn, \"answerResult\", { correct: true, gained, combo: player.combo, mult, score: player.score });\n    } else {\n      player.wrong++;\n      player.combo = 0;\n      player.stunnedUntil = Date.now() + 2000;\n      state.wrongStats[q.id] = (state.wrongStats[q.id] || 0) + 1;\n      player.wrongAnswers.push({\n        id: q.id, text: q.text, options: q.options, correct: q.correct, chosen: choice\n      });\n      PT.send(conn, \"answerResult\", { correct: false, gained: 0, combo: 0, mult, score: player.score, stunMs: 2000, qId: q.id, text: q.text, options: q.options, correctIndex: q.correct, chosen: choice });\n    }\n\n    const answered = Object.keys(state.answersThisQ).length;\n    const online = Object.values(state.players).filter((p) => p.online).length;\n    el.answerStat.textContent = `${answered}/${online} đã trả lời`;\n    renderLiveBoard();\n    drawRace();\n    broadcastState();\n\n    if (answered >= online && online > 0) {\n      clearTimeout(state.qTimer);\n      setTimeout(() => resolveQuestion(), 800);\n    }\n  }\n\n  function resolveQuestion() {\n    if (state.phase !== \"live\") return;\n    Object.values(state.players).forEach((p) => { p.answering = false; });\n    // brief pause then next\n    PT.broadcast(state.conns, \"betweenQuestions\", { players: Object.values(state.players).map(publicPlayer) });\n    el.currentQText.textContent = \"🌌 Đang bay tới cổng câu hỏi tiếp theo…\";\n    el.currentQOpts.innerHTML = \"\";\n    el.answerStat.textContent = \"Né thiên thạch — chờ cổng \\\"?\\\"\";\n    renderLiveBoard();\n    drawRace();\n    clearTimeout(state.qTimer);\n    state.qTimer = setTimeout(() => {\n      if (state.phase === \"live\") nextQuestion();\n    }, state.flightGapMs);\n  }\n\n  function handleUseItem(conn, payload) {\n    if (!state.settings.itemsOn || state.phase !== \"live\") return;\n    const player = Object.values(state.players).find((p) => p.peerId === conn.peer);\n    if (!player) return;\n    const itemId = payload.itemId;\n    const idx = player.items.indexOf(itemId);\n    if (idx < 0) return;\n    // cannot attack while target answering — skip targets that answering\n    player.items.splice(idx, 1);\n    const others = Object.values(state.players).filter((p) => p.id !== player.id && p.online && !p.answering);\n\n    if (itemId === \"shield\") {\n      player.shieldUntil = Date.now() + 8000;\n      PT.send(conn, \"itemEffect\", { itemId, self: true, message: \"🛡️ Khiên bảo vệ 8 giây!\" });\n    } else if (itemId === \"comet\") {\n      others.forEach((t) => {\n        if (t.shieldUntil > Date.now()) return;\n        t.stunnedUntil = Date.now() + 2500;\n        const c = state.conns[t.peerId];\n        PT.send(c, \"itemEffect\", { itemId, self: false, from: player.name, message: \"☄️ Sao chổi chắn đường! Mất lái 2.5s\" });\n      });\n      PT.send(conn, \"itemEffect\", { itemId, self: true, message: \"Đã phóng sao chổi!\" });\n    } else if (itemId === \"missile\") {\n      // hit lowest progress opponent\n      const target = others.filter((t) => t.shieldUntil <= Date.now()).sort((a, b) => b.progress - a.progress)[0];\n      if (target) {\n        target.score = Math.max(0, target.score - 50);\n        target.stunnedUntil = Date.now() + 2000;\n        PT.send(state.conns[target.peerId], \"itemEffect\", { itemId, self: false, from: player.name, message: \"🚀 Trúng tên lửa! -50 điểm\" });\n      }\n      PT.send(conn, \"itemEffect\", { itemId, self: true, message: \"Đã phóng tên lửa!\" });\n    } else if (itemId === \"dust\") {\n      others.forEach((t) => {\n        if (t.shieldUntil > Date.now()) return;\n        PT.send(state.conns[t.peerId], \"itemEffect\", { itemId, self: false, from: player.name, message: \"🌫️ Mây bụi che màn hình 4 giây!\", duration: 4000 });\n      });\n      PT.send(conn, \"itemEffect\", { itemId, self: true, message: \"Đã thả mây bụi!\" });\n    }\n    broadcastState();\n    renderLiveBoard();\n  }\n\n  function tick() {\n    if (state.phase !== \"live\") return;\n    const now = Date.now();\n    const left = Math.max(0, state.gameEndsAt - now);\n    const m = Math.floor(left / 60000);\n    const s = Math.floor((left % 60000) / 1000);\n    el.liveTimer.textContent = String(m).padStart(2, \"0\") + \":\" + String(s).padStart(2, \"  if (state.raceAnim) cancelAnimationFrame(state.raceAnim);\n    const loop = () => {\n      if (state.phase === \"live\" || state.phase === \"end\") {\n        drawRace(true);\n        state.raceAnim = requestAnimationFrame(loop);\n      }\n    };\n    state.raceAnim = requestAnimationFrame(loop);\n  }\n\n  function drawRace(fromAnim) {\n    const c = el.raceCanvas;\n    if (!c) return;\n    // crisp canvas\n    const rect = c.getBoundingClientRect();\n    const dpr = Math.min(2, window.devicePixelRatio || 1);\n    const cssW = Math.max(320, Math.floor(rect.width || c.width || 900));\n    const cssH = Math.max(160, Math.floor(rect.height || 200));\n    if (c.width !== Math.floor(cssW * dpr) || c.height !== Math.floor(cssH * dpr)) {\n      c.width = Math.floor(cssW * dpr);\n      c.height = Math.floor(cssH * dpr);\n      c.style.width = cssW + \"px\";\n      c.style.height = cssH + \"px\";\n    }\n    const ctx = raceCtx;\n    const W = c.width;\n    const H = c.height;\n    const now = Date.now();\n\n    ctx.setTransform(1, 0, 0, 1, 0, 0);\n    ctx.clearRect(0, 0, W, H);\n\n    // space bg\n    const g = ctx.createLinearGradient(0, 0, W, 0);\n    g.addColorStop(0, \"#050814\");\n    g.addColorStop(0.45, \"#0d1533\");\n    g.addColorStop(1, \"#1a1040\");\n    ctx.fillStyle = g;\n    ctx.fillRect(0, 0, W, H);\n\n    // parallax stars\n    ctx.fillStyle = \"rgba(255,255,255,0.75)\";\n    for (let i = 0; i < 80; i++) {\n      const speed = 0.015 + (i % 5) * 0.01;\n      const x = ((i * 97) + now * speed) % W;\n      const y = ((i * 53) + Math.sin(now / 900 + i) * 4 * dpr + H) % H;\n      const sz = (i % 3 === 0 ? 2.2 : 1.2) * dpr;\n      ctx.fillRect(x, y, sz, sz);\n    }\n\n    const planets = PT.PLANETS;\n    const pad = 70 * dpr;\n    const trackY = H * 0.55;\n    ctx.strokeStyle = \"rgba(92,225,255,0.28)\";\n    ctx.setLineDash([10 * dpr, 12 * dpr]);\n    ctx.lineWidth = 2 * dpr;\n    ctx.beginPath();\n    ctx.moveTo(pad, trackY);\n    ctx.lineTo(W - pad, trackY);\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    planets.forEach((emoji, i) => {\n      const x = pad + ((W - pad * 2) * i) / Math.max(1, planets.length - 1);\n      ctx.font = `${28 * dpr}px serif`;\n      ctx.textAlign = \"center\";\n      ctx.fillText(emoji, x, trackY - 30 * dpr);\n      ctx.fillStyle = \"rgba(155,176,208,0.85)\";\n      ctx.font = `${11 * dpr}px system-ui,sans-serif`;\n      ctx.fillText(\"Hành tinh \" + (i + 1), x, trackY - 52 * dpr);\n      ctx.fillStyle = \"rgba(255,255,255,0.7)\";\n      // soft glow under planet\n      ctx.beginPath();\n      ctx.fillStyle = \"rgba(92,225,255,0.08)\";\n      ctx.arc(x, trackY, 10 * dpr, 0, Math.PI * 2);\n      ctx.fill();\n      ctx.fillStyle = \"rgba(255,255,255,0.7)\";\n    });\n\n    if (state.meteor) {\n      ctx.fillStyle = \"rgba(255,107,214,0.1)\";\n      ctx.fillRect(0, 0, W, H);\n      for (let i = 0; i < 14; i++) {\n        const x = (now / 6 + i * 90) % (W + 40) - 20;\n        const y = (i * 37 + now / 18) % H;\n        ctx.fillStyle = \"#ffd76a\";\n        ctx.beginPath();\n        ctx.arc(x, y, 2.2 * dpr, 0, Math.PI * 2);\n        ctx.fill();\n        ctx.strokeStyle = \"rgba(255,215,106,0.65)\";\n        ctx.lineWidth = 1.5 * dpr;\n        ctx.beginPath();\n        ctx.moveTo(x, y);\n        ctx.lineTo(x - 20 * dpr, y - 9 * dpr);\n        ctx.stroke();\n      }\n    }\n\n    const players = Object.values(state.players).sort((a, b) => a.name.localeCompare(b.name));\n    const laneH = Math.min(40 * dpr, (H - 90 * dpr) / Math.max(1, players.length));\n\n    players.forEach((p, i) => {\n      const progress = Math.min(0.97, Math.max(0.03, p.progress || p.correct * 0.08 || 0.03));\n      const targetX = pad + (W - pad * 2) * progress;\n      const targetY = 55 * dpr + i * laneH + laneH / 2;\n      let vis = state.raceVisual[p.id];\n      if (!vis) {\n        vis = state.raceVisual[p.id] = { x: targetX, y: targetY };\n      }\n      // smooth chase\n      const ease = fromAnim ? 0.08 : 1;\n      vis.x += (targetX - vis.x) * ease;\n      vis.y += (targetY - vis.y) * ease;\n      const x = vis.x;\n      const y = vis.y;\n\n      // lane faint line\n      ctx.strokeStyle = \"rgba(255,255,255,0.05)\";\n      ctx.lineWidth = 1 * dpr;\n      ctx.beginPath();\n      ctx.moveTo(pad, y);\n      ctx.lineTo(W - pad, y);\n      ctx.stroke();\n\n      // engine trail\n      const trail = ctx.createLinearGradient(x - 40 * dpr, y, x, y);\n      trail.addColorStop(0, \"rgba(0,0,0,0)\");\n      trail.addColorStop(1, p.color + \"88\");\n      ctx.fillStyle = trail;\n      ctx.beginPath();\n      ctx.moveTo(x - 36 * dpr, y);\n      ctx.lineTo(x - 8 * dpr, y - 5 * dpr);\n      ctx.lineTo(x - 8 * dpr, y + 5 * dpr);\n      ctx.closePath();\n      ctx.fill();\n\n      // glow\n      ctx.beginPath();\n      ctx.fillStyle = p.color + \"55\";\n      ctx.arc(x, y, 16 * dpr, 0, Math.PI * 2);\n      ctx.fill();\n      // ship body pointing right, in the student's chosen shape/colour\n      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 2);\n      PT.drawShip(ctx, p.color, p.shape, 0.8 * dpr); ctx.restore();\n      // name\n      ctx.fillStyle = \"#eef4ff\";\n      ctx.font = `bold ${11 * dpr}px system-ui,sans-serif`;\n      ctx.fillText(p.name.split(\" \").slice(-1)[0], x, y + 24 * dpr);\n      if (p.shieldUntil > now) {\n        ctx.strokeStyle = \"rgba(93,255,154,0.85)\";\n        ctx.lineWidth = 2 * dpr;\n        ctx.beginPath();\n        ctx.arc(x, y, 20 * dpr, 0, Math.PI * 2);\n        ctx.stroke();\n      }\n    });\n  }\n\n  // expose for tests\n\n  window.__HOST__ = state;\n  window.__HOST_API__ = { bank, buildRound, setGrade, startGame, nextQuestion, endGame, createRoom, parseQuestionsFromUI, refreshQCount };\n\n  // preload sample for convenience in demo\n  setGrade(\"lop3\");\n  show(\"setupView\");\n})();\n"}, "student": {"cls": "student stars", "html": "\n  <!-- JOIN -->\n  <section id=\"joinView\" class=\"wrap\" style=\"max-width:420px\">\n    <div class=\"center mb .textContent = \"🔥 \" + (state.me.combo || 0);\n    const items = (state.me.items || [])\n      .map((id) => {\n        const found = Object.values(PT.ITEMS).find((x) => x.id === id);\n        return found ? found.emoji : \"❓\";\n      })\n      .join(\"\") || \"🎒\";\n    el.hudItems.textContent = items;\n    // tap items to use\n    el.hudItems.style.pointerEvents = \"auto\";\n    el.hudItems.style.cursor = \"pointer\";\n  }\n\n  el.hudItems.addEventListener(\"click\", () => {\n    if (!state.me || !state.me.items || !state.me.items.length) {\n      PT.toast(\"Chưa có vật phẩm\");\n      return;\n    }\n    const id = state.me.items[0];\n    PT.send(state.conn, \"useItem\", { itemId: id });\n  });\n\n  function queueQuestion(payload) {\n    if (!payload || !payload.question) return;\n    state.pendingQuestion = payload;\n    state.meteor = !!payload.meteor;\n    // Only reveal after the ship hits a glowing \"?\" gate — never instantly.\n    if (state.flight && state.flight.pausedForQuestion) {\n      revealPendingQuestion();\n      return;\n    }\n    if (state.flight) {\n      state.flight.ensureGate = true;\n      el.idleBox.classList.remove(\"hidden\");\n      el.idleBox.innerHTML = `<div>✨ Cổng câu hỏi đang tới…<br/><span class=\"subtitle\">Lái vào cổng \"?\" sáng để trả lời<\/span><\/div>`;\n    } else {\n      // fallback if flight not up yet\n      startFlight();\n      if (state.flight) state.flight.ensureGate = true;\n    }\n  }\n\n  function revealPendingQuestion() {\n    const payload = state.pendingQuestion;\n    if (!payload || !payload.question) return;\n    state.pendingQuestion = null;\n    showQuestion(payload);\n  }\n\n  function showQuestion(payload) {\n    state.question = payload.question;\n    state.qDeadline = payload.qDeadline;\n    state.answered = false;\n    state.meteor = !!payload.meteor;\n    if (state.flight) {\n      state.flight.pausedForQuestion = true;\n      state.flight.speedMul = 0.15;\n    }\n    el.idleBox.classList.add(\"hidden\");\n    el.qBox.classList.remove(\"hidden\");\n    el.qText.textContent = payload.question.text;\n    el.qNum.textContent = `Câu ${(payload.question.index || 0) + 1}/${payload.question.total || \"?\"}`;\n    el.answers.innerHTML = \"\";\n    const letters = [\"A\", \"B\", \"C\", \"D\"];\n    const classes = [\"ans-a\", \"ans-b\", \"ans-c\", \"ans-d\"];\n    payload.question.options.forEach((opt, i) => {\n      const b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.className = \"ans \" + classes[i];\n      b.innerHTML = `<span class=\"letter\">${letters[i]}<\/span><span>${escapeHtml(opt)}<\/span>`;\n      b.onclick = () => submitAnswer(i, b);\n      el.answers.appendChild(b);\n    });\n    tickQTimer();\n  }\n\n  function tickQTimer() {\n    if (!state.question) return;\n    const left = Math.max(0, Math.ceil((state.qDeadline - Date.now()) / 1000));\n    el.qTimer.textContent = left + \"s\" + (state.meteor ? \" · x2\" : \"\");\n    if (left > 0 && !state.answered) requestAnimationFrame(() => setTimeout(tickQTimer, 200));\n  }\n\n  function submitAnswer(choice, btn) {\n    if (state.answered) return;\n    state.answered = true;\n    PT.qsa(\".ans\").forEach((a) => { a.disabled = true; });\n    if (btn) btn.style.outline = \"3px solid #fff\";\n    PT.send(state.conn, \"answer\", { choice });\n  }\n\n  function onAnswerResult(payload) {\n    const fb = el.feedback;\n    fb.classList.remove(\"hidden\");\n    if (payload.correct) {\n      fb.style.color = \"#5dff9a\";\n      fb.textContent = \"ĐÚNG! TĂNG TỐC 🚀\" + (payload.mult > 1 ? \" x2\" : \"\") + \"\\n+\" + payload.gained;\n      if (state.flight) {\n        state.flight.boostUntil = Date.now() + 1800;\n        state.flight.speedMul = 1.8;\n        state.flight.flameTrail = 1;\n      }\n    } else {\n      fb.style.color = \"#ff6b7a\";\n      fb.textContent = \"SAI! MẤT LÁI 😵\";\n      if (state.flight) {\n        state.flight.stunnedUntil = Date.now() + (payload.stunMs || 2200);\n        state.flight.shakeUntil = Date.now() + 900;\n      }\n      const wText = payload.text || (state.question && state.question.text) || \"\";\n      const already = state.wrongAnswers.some((w) => (w.text || \"\").trim().toLowerCase() === String(wText).trim().toLowerCase());\n      if (!already) {\n        state.wrongAnswers.push({\n          text: wText,\n          options: payload.options || (state.question && state.question.options) || [],\n          correct: payload.correctIndex != null ? payload.correctIndex : -1,\n          chosen: payload.chosen != null ? payload.chosen : -1\n        });\n      }\n    }\n    setTimeout(() => fb.classList.add(\"hidden\"), 1400);\n    if (state.me) {\n      state.me.score = payload.score;\n      state.me.combo = payload.combo;\n      updateHud();\n    }\n  }\n\n  function hideQuestion(resumeFlight) {\n    state.question = null;\n    state.pendingQuestion = null;\n    el.qBox.classList.add(\"hidden\");\n    el.idleBox.classList.remove(\"hidden\");\n    el.idleBox.innerHTML = `<div>🌌 Đang bay tới cổng câu hỏi…<br/><span class=\"subtitle\">Né thiên thạch bằng ◀ ▶ hoặc vuốt<\/span><\/div>`;\n    if (state.flight && resumeFlight) {\n      state.flight.pausedForQuestion = false;\n      state.flight.speedMul = 1;\n      state.flight.gateCooldown = 0.8 + Math.random() * 0.6;\n      state.flight.gates = [];\n      state.flight.ensureGate = false;\n      state.flight.awaitingGate = false;\n    }\n  }\n\n  function onItemEffect(payload) {\n    PT.toast(payload.message || \"Vật phẩm!\");\n    if (payload.itemId === \"dust\" && !payload.self) {\n      state.dustUntil = Date.now() + (payload.duration || 4000);\n      el.dustOverlay.classList.remove(\"hidden\");\n      setTimeout(() => el.dustOverlay.classList.add(\"hidden\"), payload.duration || 4000);\n    }\n    if (payload.itemId === \"comet\" && !payload.self && state.flight) {\n      state.flight.stunnedUntil = Date.now() + 2500;\n    }\n    if (payload.itemId === \"missile\" && !payload.self && state.flight) {\n      state.flight.stunnedUntil = Date.now() + 2000;\n    }\n  }\n\n  function showResult(payload) {\n    stopFlight();\n    state.phase = \"end\";\n    show(\"resultView\");\n    const ranked = payload.ranked || [];\n    const me = ranked.find((p) => p.id === state.playerId) || state.me;\n    const rank = me && me.rank ? me.rank : ranked.findIndex((p) => p.id === state.playerId) + 1;\n    el.resultRank.textContent = \"🏅 Hạng \" + (rank || \"?\");\n    el.resultName.textContent = (me && me.emoji ? me.emoji + \" \" : \"\") + (me ? me.name : \"\");\n    el.resultScore.textContent = (me ? me.score : 0) + \" điểm\";\n    el.resultStats.textContent = me ? `Đúng ${me.correct} · Sai ${me.wrong}` : \"\";\n    // wrong review from last known — host doesn't send per-player wrong detail in compact form;\n    // keep local if we tracked — otherwise list from host questions where we might not have detail\n    // Student tracks via answerResult wrong only partially; enhance: store on wrong\n    const uniqueWrong = [];\n    const seenW = new Set();\n    state.wrongAnswers.forEach((w) => {\n      const key = String(w.text || \"\").trim().toLowerCase();\n      if (!key || seenW.has(key)) return;\n      seenW.add(key); uniqueWrong.push(w);\n    });\n    if (!uniqueWrong.length) {\n      el.wrongReview.innerHTML = `<p class=\"subtitle\">Xem bảng \"Câu cần giảng lại\" trên màn hình giáo viên nhé!<\/p>`;\n    } else {\n      el.wrongReview.innerHTML = uniqueWrong\n        .map(\n          (w) =>\n            `<div class=\"wrong-q\"><b>${escapeHtml(w.text)}<\/b><div class=\"subtitle\">Em chọn ${\"ABCD\"[w.chosen]}. · Đúng: ${\"ABCD\"[w.correct]}. ${escapeHtml(w.options[w.correct] || \"\")}<\/div><\/div>`\n        )\n        .join(\"\");\n    }\n  }\n\n  // patch answerResult to store wrongs\n  const _onAnswerResult = onAnswerResult;\n  // already defined — wrap via monkey: store when incorrect by listening again\n  // simpler: in submit we don't know correctness until result — hook below\n  const orig = onAnswerResult;\n  // re-assign by replacing references — actually edit logic:\n  // We'll store in onAnswerResult by checking payload and state.question\n\n  // Flight engine — scrolling starfield, lanes, asteroids, glowing \"?\" gates\n  function startFlight() {\n    if (state.flight && state.flight.running) return;\n    const canvas = el.shipCanvas;\n    const parent = canvas.parentElement;\n    const resize = () => {\n      const r = parent.getBoundingClientRect();\n      const w = Math.max(1, Math.floor(r.width));\n      const h = Math.max(1, Math.floor(r.height));\n      const dpr = Math.min(2.5, window.devicePixelRatio || 1);\n      canvas.width = Math.floor(w * dpr);\n      canvas.height = Math.floor(h * dpr);\n      canvas.style.width = w + \"px\";\n      canvas.style.height = h + \"px\";\n      if (state.flight) state.flight.dpr = dpr;\n    };\n    resize();\n    if (!state._flightResizeBound) {\n      window.addEventListener(\"resize\", resize);\n      state._flightResizeBound = true;\n    }\n\n    const flight = {\n      lane: 2,\n      laneX: 2,\n      lanes: 5,\n      y: 0.78,\n      asteroids: [],\n      gates: [],\n      stars: [],\n      particles: [],\n      stunnedUntil: 0,\n      shieldUntil: 0,\n      boostUntil: 0,\n      shakeUntil: 0,\n      lastSpawn: 0,\n      gateCooldown: 1.2,\n      ensureGate: false,\n      awaitingGate: false,\n      pausedForQuestion: false,\n      speedMul: 1,\n      flameTrail: 0,\n      raf: 0,\n      running: true,\n      dpr: Math.min(2.5, window.devicePixelRatio || 1)\n    };\n    for (let i = 0; i < 55; i++) {\n      flight.stars.push({\n        x: Math.random(),\n        y: Math.random(),\n        s: Math.random() * 2.2 + 0.4,\n        v: Math.random() * 0.55 + 0.25\n      });\n    }\n    state.flight = flight;\n\n    const left = () => {\n      if (Date.now() < flight.stunnedUntil || flight.pausedForQuestion) return;\n      flight.lane = Math.max(0, flight.lane - 1);\n    };\n    const right = () => {\n      if (Date.now() < flight.stunnedUntil || flight.pausedForQuestion) return;\n      flight.lane = Math.min(flight.lanes - 1, flight.lane + 1);\n    };\n    PT.qs(\"#btnLeft\").ontouchstart = (e) => { e.preventDefault(); left(); };\n    PT.qs(\"#btnRight\").ontouchstart = (e) => { e.preventDefault(); right(); };\n    PT.qs(\"#btnLeft\").onclick = left;\n    PT.qs(\"#btnRight\").onclick = right;\n\n    // swipe on flight area\n    let touchX = null;\n    parent.ontouchstart = (e) => {\n      if (e.touches && e.touches[0]) touchX = e.touches[0].clientX;\n    };\n    parent.ontouchend = (e) => {\n      if (touchX == null) return;\n      const x = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : touchX;\n      const dx = x - touchX;\n      touchX = null;\n      if (Math.abs(dx) < 28) return;\n      if (dx < 0) left(); else right();\n    };\n\n    const ctx = canvas.getContext(\"2d\");\n    let last = performance.now();\n\n    function spawnGate(forceLane) {\n      const lane = forceLane != null ? forceLane : Math.floor(Math.random() * flight.lanes);\n      flight.gates.push({ lane, y: -0.18, hit: false, pulse: Math.random() * Math.PI * 2 });\n      flight.awaitingGate = true;\n      flight.ensureGate = false;\n    }\n\n    function drawShip(dpr, color, shape, scale) { PT.drawShip(ctx, color, shape, (scale || 1) * dpr); }\n\n    function frame(now) {\n      if (!flight.running) return;\n      const dt = Math.min(0.05, (now - last) / 1000);\n      last = now;\n      const W = canvas.width;\n      const H = canvas.height;\n      const dpr = flight.dpr || 1;\n      if (W < 2 || H < 2) {\n        resize();\n        flight.raf = requestAnimationFrame(frame);\n        return;\n      }\n\n      const boosting = Date.now() < flight.boostUntil;\n      const stunned = Date.now() < flight.stunnedUntil;\n      const shielded = Date.now() < flight.shieldUntil;\n      let speed = flight.speedMul * (boosting ? 1.55 : 1)
