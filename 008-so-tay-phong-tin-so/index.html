function seatOptions(cur){const o=[`<option value="" ${!cur?'selected':''}>Dùng chung trong phòng</option>`,`<option value="GV" ${cur==='GV'?'selected':''}>Máy giáo viên</option>`];for(const n of seatList())o.push(`<option value="${pad(n)}" ${cur===pad(n)?'selected':''}>Máy ${pad(n)}</option>`);return o.join('')}
function invFiltered(){const q=fold(U.q);return live('assets').filter(a=>{const st=assetStatus(a);if(U.invCat&&a.cat!==U.invCat)return false;if(U.invSt&&st!==U.invSt)return false;if(!U.invSt&&st==='retired'&&!q)return false;if(U.invLoc==='seat'&&!(a.seat&&a.seat!=='GV'))return false;if(U.invLoc==='GV'&&a.seat!=='GV')return false;if(U.invLoc==='room'&&a.seat)return false;return !q||fold([a.code,a.name,a.brand,a.model,a.serial,CAT[a.cat].n,a.note,assetWhere(a)].join(' ')).includes(q)}).sort((a,b)=>CATS.findIndex(c=>c.k===a.cat)-CATS.findIndex(c=>c.k===b.cat)||coll.compare(a.code||'',b.code||''))}
function viewInv(){if(!S.settings.setup&&!live('assets').length)return setupPrompt();const all=live('assets');const cats=CATS.filter(c=>all.some(a=>a.cat===c.k));
 const catCard=(k,n,ic,list)=>{const act=list.filter(a=>!a.retired);const q=act.reduce((s,a)=>s+(+a.qty||1),0);const c={ok:0,minor:0,repair:0,broken:0};act.forEach(a=>c[assetStatus(a)]+=(+a.qty||1));const bad=q-c.ok;
  return `<div class="card cat hov ${U.invCat===k?'on':''}" data-a="invCat" data-v="${k}"><span class="ci">${IC[ic]}</span><b class="num" data-count="${q}">0</b><span>${esc(n)}</span><div class="hb">${['ok','minor','repair','broken'].map(s=>`<i style="width:${q?c[s]/q*100:0}%;background:${STC[s]}"></i>`).join('')}</div><small class="hint" style="display:block;margin-top:.5rem">${bad?bad+' cần chú ý':'Tất cả đều tốt'}</small></div>`};
 const list=invFiltered();
 return `<div class="cats">${catCard('','Tất cả thiết bị','layers',all)}${cats.map(c=>catCard(c.k,c.n,c.ic,all.filter(a=>a.cat===c.k))).join('')}</div>
 <div class="row"><div class="row" style="gap:.4rem">${[['','Đang dùng'],['ok','Tốt'],['minor','Lỗi nhẹ'],['broken','Hỏng'],['repair','Đang sửa'],['retired','Đã thanh lý']].map(([k,n])=>`<button class="chip ${U.invSt===k?'on':''}" data-a="invSt" data-v="${k}">${n}</button>`).join('')}</div><select class="sel" style="width:auto" data-ch="invLoc"><option value="">Mọi vị trí</option><option value="seat" ${U.invLoc==='seat'?'selected':''}>Máy học sinh</option><option value="GV" ${U.invLoc==='GV'?'selected':''}>Máy giáo viên</option><option value="room" ${U.invLoc==='room'?'selected':''}>Dùng chung</option></select><span class="sp"></span><span class="hint">${list.length} mục</span><button class="btn gl sm" data-a="printInv">${IC.print}Biên bản kiểm kê</button><button class="btn gl sm" data-a="xlsInv">${IC.xls}Excel</button><button class="btn pri sm" data-a="newAsset">${IC.plus}Nhận thiết bị mới</button></div>
 ${list.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Mã</th><th>Tên thiết bị</th><th>Vị trí</th><th>SL</th><th>Ngày nhận</th><th>Ngày ghi sổ</th><th>Tình trạng</th></tr></thead><tbody>${list.slice(0,400).map(a=>{const st=assetStatus(a);return `<tr class="clk" data-a="asset" data-id="${a.id}"><td class="num"><b>${esc(a.code)}</b></td><td><div class="row" style="gap:.7rem;flex-wrap:nowrap"><span style="color:var(--vio)">${IC[CAT[a.cat].ic].replace('<svg','<svg width="18" height="18"')}</span><div><b style="font-weight:600">${esc(assetName(a))}</b>${a.brand||a.model?`<div class="muted">${esc([a.brand,a.model].filter(Boolean).join(' '))}</div>`:''}</div></div></td><td>${esc(assetWhere(a))}</td><td class="num">${+a.qty||1} <span class="muted">${esc(a.unit||'')}</span></td><td>${vnDate(a.received)}</td><td class="muted">${a.recorded?new Date(a.recorded).toLocaleDateString('vi-VN'):''}</td><td><span class="tag st-${st}">${ST[st]}</span></td></tr>`}).join('')}</tbody></table></div>${list.length>400?`<p class="hint">Đang hiện 400 mục đầu, hãy lọc hoặc tìm để thu hẹp.</p>`:''}`:`<div class="card">${emptyHTML('search','Không có thiết bị phù hợp','Thử bỏ bớt bộ lọc hoặc đổi từ khoá tìm kiếm.')}</div>`}`}
function assetDrawer(id){const a=get('assets',id);if(!a)return;const st=assetStatus(a),oi=issuesOf(a.id);
 const kv=[['Mã',a.code],['Loại',CAT[a.cat].n],['Vị trí',assetWhere(a)],['Số lượng',(+a.qty||1)+' '+(a.unit||'')],['Hãng, model',[a.brand,a.model].filter(Boolean).join(' ')],['Số serial',a.serial],['Nguồn',a.source],['Giá trị',money(a.value)],['Ngày nhận',vnDate(a.received)],['Ngày ghi sổ',fmtTs(a.recorded)],['Ghi chú',a.note]].filter(x=>x[1]);
 drawer(`<span class="comp" style="--c:${STC[st]};margin:0;padding:0;border:0;background:none"><span class="ci">${IC[CAT[a.cat].ic]}</span></span><div><h2>${esc(assetName(a))}</h2><span class="tag st-${st}">${ST[st]}</span></div>`,
 `<div class="tblwrap" style="margin-bottom:1rem"><table class="tbl"><tbody>${kv.map(x=>`<tr><td class="muted" style="width:9rem">${x[0]}</td><td>${esc(x[1])}</td></tr>`).join('')}</tbody></table></div>
 ${oi.map(i=>`<div class="banner" style="margin-bottom:.6rem;cursor:pointer" data-a="issue" data-id="${i.id}">${IC.alert}<div class="grow"><b>${esc(i.title)}</b><br><small>${i.status==='repair'?'Đang sửa':'Báo ngày '+vnDate(i.date)}</small></div>${IC.arrow}</div>`).join('')}
 <div class="eyebrow" style="margin:1.2rem 0 .9rem;color:var(--mu)">Lịch sử thiết bị</div>${timelineHTML([a.id])}`,
 `<button class="btn gl" data-a="editAsset" data-id="${a.id}">${IC.edit}Sửa</button>${a.retired?`<button class="btn gl" data-a="restoreAsset" data-id="${a.id}">Dùng lại</button>`:`<button class="btn bad" data-a="reportIssue" data-aid="${a.id}">${IC.alert}Báo hỏng</button><button class="btn gl" data-a="moveAsset" data-id="${a.id}">${IC.arrow}Điều chuyển</button><button class="btn qt" data-a="retireAsset" data-id="${a.id}">Thanh lý</button>`}<span class="sp"></span><button class="btn qt ic" data-a="delAsset" data-id="${a.id}" aria-label="Xoá">${IC.trash}</button>`)}
function assetForm(o={}){const a=o.id?get('assets',o.id):null;const rep=o.replace?get('issues',o.replace):null;const old=rep?get('assets',rep.aid):null;
 const cat=a?a.cat:(old?old.cat:(o.cat||'monitor')),seat=a?a.seat||'':(old?old.seat||'':(o.seat||''));
 const title=a?'Sửa thông tin thiết bị':rep?'Thay thiết bị mới':'Nhận thiết bị mới';
 modal(title,`${rep?`<div class="banner info" style="margin-bottom:1rem">${IC.recycle}<div>Thay cho <b>${esc(old?.code||'')} ${esc(assetName(old))}</b>. Thiết bị cũ sẽ được ghi "Đã thanh lý" và sự cố được đóng.</div></div>`:''}
 <div class="g3"><label class="fl"><span>Loại thiết bị</span><select class="sel" id="afCat">${CATS.map(c=>`<option value="${c.k}" ${c.k===cat?'selected':''}>${c.n}</option>`).join('')}</select></label><label class="fl" style="grid-column:span 2"><span>Tên thiết bị</span><input class="inp" id="afName" value="${esc(a?a.name:'')}" placeholder="${esc(CAT[cat].s)} ..." autofocus></label></div>
 <div class="g4" style="margin-top:1rem"><label class="fl"><span>Mã</span><input class="inp" id="afCode" value="${esc(a?a.code:nextCode(cat))}"></label><label class="fl"><span>Số lượng</span><input class="inp" id="afQty" inputmode="numeric" value="${a?+a.qty||1:1}" ${a?'':''}></label><label class="fl"><span>Đơn vị</span><input class="inp" id="afUnit" value="${esc(a?a.unit||'':CAT[cat].u)}"></label><label class="fl"><span>Vị trí</span><select class="sel" id="afSeat" ${a?'disabled title="Dùng Điều chuyển để đổi vị trí"':''}>${seatOptions(seat)}</select></label></div>
 ${a?'':`<label class="row" style="margin-top:.7rem;gap:.5rem;color:var(--tx2)" id="afSplitW"><input type="checkbox" id="afSplit" checked> Khi số lượng lớn hơn 1, tạo riêng từng chiếc (mỗi chiếc một mã, theo dõi hỏng riêng)</label>`}
 <div class="g3" style="margin-top:1rem"><label class="fl"><span>Hãng</span><input class="inp" id="afBrand" value="${esc(a?.brand||old?.brand||'')}" placeholder="Dell, HP, Logitech..."></label><label class="fl"><span>Model</span><input class="inp" id="afModel" value="${esc(a?.model||'')}"></label><label class="fl"><span>Số serial</span><input class="inp" id="afSerial" value="${esc(a?.serial||'')}"></label></div>
 <div class="g3" style="margin-top:1rem"><label class="fl"><span>Nguồn</span><input class="inp" id="afSrc" list="srcL" value="${esc(a?.source||'')}"><datalist id="srcL">${SOURCES.map(s=>`<option value="${s}">`).join('')}</datalist></label><label class="fl"><span>Giá trị mỗi chiếc (đồng)</span><input class="inp" id="afVal" inputmode="numeric" value="${a?.value||''}"></label><label class="fl"><span>Ngày nhận</span><input type="date" class="inp" id="afRec" value="${a?.received||isoDate()}"></label></div>
 <label class="fl" style="margin-top:1rem"><span>Ghi chú</span><textarea class="inp" id="afNote" rows="2">${esc(a?.note||'')}</textarea></label>
 <p class="hint" style="margin-top:.8rem">${a?'Ghi sổ lần đầu lúc '+fmtTs(a.recorded)+'.':'Ngày ghi sổ được lưu tự động: '+fmtTs(Date.now())+'.'}</p>`,
 `<button class="btn gl" data-a="closeModal">Huỷ</button><button class="btn pri" id="afOk">${IC.check}${a?'Lưu thay đổi':'Ghi vào sổ kiểm kê'}</button>`,'wide');
 $('#afCat').onchange=e=>{const c=e.target.value;if(!a){$('#afCode').value=nextCode(c);$('#afUnit').value=CAT[c].u}$('#afName').placeholder=CAT[c].s+' ...'};
 $('#afOk').onclick=()=>{const c=$('#afCat').value,name=$('#afName').value.trim()||CAT[c].s,qty=Math.max(1,+$('#afQty').value||1);
  const base={cat:c,unit:$('#afUnit').value.trim(),brand:$('#afBrand').value.trim(),model:$('#afModel').value.trim(),serial:$('#afSerial').value.trim(),source:$('#afSrc').value.trim(),value:+String($('#afVal').value).replace(/\D/g,'')||0,received:$('#afRec').value||isoDate(),note:$('#afNote').value.trim()};
  if(a){Object.assign(a,base,{name,code:$('#afCode').value.trim()||a.code,qty});put('assets',a);addEvent(a.id,'edit',isoDate(),'Cập nhật thông tin');closeModal();toast('Đã lưu thiết bị '+a.code);refresh();assetDrawer(a.id);return}
  const seatV=$('#afSeat').value,split=qty>1&&$('#afSplit').checked;const made=[];
  const mk=(code,nm,q)=>{const r=put('assets',{...base,code,name:nm,qty:q,seat:seatV,recorded:Date.now(),status:'ok'});addEvent(r.id,'receive',base.received,[base.source,rep?'Thay cho '+old.code:''].filter(Boolean).join(' · ')||'Nhận mới');made.push(r)};
  if(split){let code=$('#afCode').value.trim();for(let i=0;i<qty;i++){mk(i?nextCode(c):code,name+' '+(i+1),1)}}else mk($('#afCode').value.trim()||nextCode(c),name,qty);
  if(rep&&old){addStep(rep,'replaced',base.received,'Thay bằng '+made[0].code);old.retired=true;old.retiredDate=base.received;put('assets',old);addEvent(old.id,'retire',base.received,'Thay bằng '+made[0].code)}
  closeModal();toast(made.length>1?`Đã ghi ${made.length} thiết bị mới vào sổ`:'Đã ghi '+made[0].code+' vào sổ kiểm kê','pkg');refresh();if(made.length===1)assetDrawer(made[0].id)}}
function moveAsset(id){const a=get('assets',id);modal('Điều chuyển thiết bị',`<p class="hint" style="margin-bottom:1rem">${esc(a.code)} · ${esc(assetName(a))} đang ở <b>${esc(assetWhere(a))}</b>.</p><div class="g2"><label class="fl"><span>Chuyển đến</span><select class="sel" id="mvTo">${seatOptions(a.seat||'')}<option value="__out">Chuyển ra khỏi phòng</option></select></label><label class="fl"><span>Ngày</span><input type="date" class="inp" id="mvDate" value="${isoDate()}"></label></div><label class="fl" style="margin-top:1rem"><span>Ghi chú</span><input class="inp" id="mvNote" placeholder="Ví dụ: đổi màn hình từ máy 05 sang máy 12"></label>`,`<button class="btn gl" data-a="closeModal">Huỷ</button><button class="btn pri" id="mvOk">${IC.check}Điều chuyển</button>`,'sm');
 $('#mvOk').onclick=()=>{const to=$('#mvTo').value,from=assetWhere(a);if(to==='__out'){a.retired=true;a.retiredDate=$('#mvDate').value;a.seat='';a.loc='Đã chuyển đi'}else a.seat=to;put('assets',a);addEvent(a.id,to==='__out'?'retire':'move',$('#mvDate').value,`Từ ${from} đến ${to==='__out'?'ngoài phòng':assetWhere(a)}${$('#mvNote').value.trim()?' · '+$('#mvNote').value.trim():''}`);closeModal();toast('Đã điều chuyển '+a.code);refresh();assetDrawer(a.id)}}
async function retireAsset(id){const a=get('assets',id);const oi=issuesOf(id);if(oi.length){stepDlg(oi[0].id,'retired');return}if(!await confirmBox('Thanh lý thiết bị?',`${esc(a.code)} sẽ chuyển sang "Đã thanh lý", không tính vào thiết bị đang dùng. Lịch sử vẫn được giữ.`,'Thanh lý'))return;a.retired=true;a.retiredDate=isoDate();put('assets',a);addEvent(id,'retire',isoDate(),'');refresh();assetDrawer(id);toast('Đã thanh lý '+a.code,'trash')}
function restoreAsset(id){const a=get('assets',id);a.retired=false;if(a.loc==='Đã chuyển đi')a.loc='';put('assets',a);addEvent(id,'restore',isoDate(),'');refresh();assetDrawer(id);toast('Đã đưa '+a.code+' về sử dụng')}
async function delAsset(id){const a=get('assets',id);if(!await confirmBox('Xoá khỏi sổ?',`Chỉ xoá khi ghi nhầm. Nếu thiết bị hỏng hoặc không dùng nữa, hãy chọn "Thanh lý" để giữ lịch sử. Xoá ${esc(a.code)}?`,'Xoá hẳn'))return;del('assets',id);closeDrawer();refresh();toast('Đã xoá '+a.code,'trash')}
function invSummary(){return CATS.map(c=>{const l=live('assets').filter(a=>a.cat===c.k);if(!l.length)return null;const r={c,tot:0,ok:0,minor:0,repair:0,broken:0,retired:0,val:0};l.forEach(a=>{const q=+a.qty||1,s=assetStatus(a);r[s]+=q;if(s!=='retired')r.tot+=q;r.val+=(+a.value||0)*q});return r}).filter(Boolean)}
function printInv(){const sm=invSummary(),d=new Date();const det=CATS.map(c=>{const l=live('assets').filter(a=>a.cat===c.k).sort((a,b)=>coll.compare(a.code,b.code));return l.length?[c,l]:null}).filter(Boolean);
 printShell('Biên bản kiểm kê tài sản phòng Tin học',`Ngày ${d.getDate()} tháng ${d.getMonth()+1} năm ${d.getFullYear()} · Năm học ${esc(S.settings.year)}`,`<div class="sec">I. Tổng hợp</div><table><thead><tr><th>STT</th><th>Loại thiết bị</th><th>Đang dùng</th><th>Tốt</th><th>Lỗi nhẹ</th><th>Đang sửa</th><th>Hỏng</th><th>Đã thanh lý</th><th>Giá trị (đ)</th></tr></thead><tbody>${sm.map((r,i)=>`<tr><td class="c">${i+1}</td><td>${esc(r.c.n)}</td>${['tot','ok','minor','repair','broken','retired'].map(k=>`<td class="c">${r[k]||''}</td>`).join('')}<td class="c">${r.val?r.val.toLocaleString('vi-VN'):''}</td></tr>`).join('')}</tbody></table>
 <div class="sec">II. Chi tiết</div><table><thead><tr><th>Mã</th><th>Tên thiết bị</th><th>Vị trí</th><th>SL</th><th>ĐVT</th><th>Hãng, model, serial</th><th>Ngày nhận</th><th>Tình trạng</th><th>Ghi chú</th></tr></thead><tbody>${det.map(([c,l])=>`<tr><td colspan="9"><b>${esc(c.n)}</b></td></tr>`+l.map(a=>`<tr><td class="c">${esc(a.code)}</td><td>${esc(assetName(a))}</td><td>${esc(assetWhere(a))}</td><td class="c">${+a.qty||1}</td><td class="c">${esc(a.unit||'')}</td><td>${esc([a.brand,a.model,a.serial].filter(Boolean).join(' · '))}</td><td class="c">${vnDate(a.received)}</td><td class="c">${ST[assetStatus(a)]}</td><td>${esc([a.note,...issuesOf(a.id).map(i=>i.title)].filter(Boolean).join('; '))}</td></tr>`).join('')).join('')}</tbody></table>
 <div class="sig"><div><b>Người lập biên bản</b><br><i>(Kí, ghi rõ họ tên)</i><br>${S.settings.sig?`<img class="sg" src="${S.settings.sig}" style="height:14mm;margin:2mm 0">`:'<br><br><br>'}<br><b>${esc(S.settings.teacher)}</b></div><div><b>Hiệu trưởng</b><br><i>(Kí, ghi rõ họ tên, đóng dấu)</i></div></div>`,false)}
function xlsInv(){const sm=invSummary();const a1=[[UNIT],[SCHOOL],['BIÊN BẢN KIỂM KÊ TÀI SẢN PHÒNG TIN HỌC'],['Ngày '+vnDate(isoDate())+' · Năm học '+S.settings.year],[],['STT','Loại thiết bị','Đang dùng','Tốt','Lỗi nhẹ','Đang sửa','Hỏng','Đã thanh lý','Giá trị (đ)']].concat(sm.map((r,i)=>[i+1,r.c.n,r.tot,r.ok,r.minor,r.repair,r.broken,r.retired,r.val]));
 const a2=[['Mã','Tên thiết bị','Loại','Vị trí','Số lượng','ĐVT','Hãng','Model','Serial','Nguồn','Giá trị (đ)','Ngày nhận','Ngày ghi sổ','Tình trạng','Sự cố đang mở','Ghi chú']].concat(live('assets').sort((a,b)=>coll.compare(a.code,b.code)).map(a=>[a.code,assetName(a),CAT[a.cat].n,assetWhere(a),+a.qty||1,a.unit||'',a.brand||'',a.model||'',a.serial||'',a.source||'',a.value||'',vnDate(a.received),a.recorded?new Date(a.recorded).toLocaleString('vi-VN'):'',ST[assetStatus(a)],issuesOf(a.id).map(i=>i.title).join('; '),a.note||'']));
 xlsWrite('Kiem-ke-phong-Tin-'+isoDate(),[['Tổng hợp',a1,[6,30,10,8,8,10,8,12,14]],['Chi tiết',a2,[10,28,22,14,9,7,12,14,16,20,12,12,18,12,30,30]]])}

/* ===== Báo cáo ===== */
function rpRange(){const y=S.settings.year.split('-').map(Number);return{from:U.rpFrom||(y[0]+'-08-15'),to:U.rpTo||isoDate()}}
function viewReport(){const r=rpRange();const ls=live('logs').filter(l=>l.date>=r.from&&l.date<=r.to);const is=live('issues').filter(i=>i.date>=r.from&&i.date<=r.to);
 const byCls={};ls.forEach(l=>{const n=className(l.cls);byCls[n]=(byCls[n]||0)+1});const cl=Object.entries(byCls).sort((a,b)=>coll.compare(a[0],b[0]));const mx=Math.max(1,...cl.map(x=>x[1]));
 const byG={};ls.forEach(l=>{const g=gradeOf(className(l.cls))||'Khác';byG[g]=(byG[g]||0)+1});
 const byCat={};is.forEach(i=>{const a=get('assets',i.aid);const k=a?CAT[a.cat].s:'Khác';byCat[k]=(byCat[k]||0)+1});const bc=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const mc=Math.max(1,...bc.map(x=>x[1]));
 const bySeat={};is.forEach(i=>{if(i.seat)bySeat[i.seat]=(bySeat[i.seat]||0)+1});const top=Object.entries(bySeat).sort((a,b)=>b[1]-a[1]).slice(0,5);

function parseClassRange(s){const out=[];String(s||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(p=>{const m=p.match(/^(\d+)\s*([\/.]?)\s*(\w+)\s*-\s*(?:\d+\s*[\/.]?\s*)?(\w+)$/);
 if(m){const g=m[1],sep=m[2],a=m[3],b=m[4];if(/^\d+$/.test(a)&&/^\d+$/.test(b)){for(let i=+a;i<=+b&&i-+a<30;i++)out.push(g+sep+i)}else if(/^[A-Za-z]$/.test(a)&&/^[A-Za-z]$/.test(b)){for(let c=a.toUpperCase().charCodeAt(0);c<=b.toUpperCase().charCodeAt(0);c++)out.push(g+sep+String.fromCharCode(c))}else out.push(p)}else out.push(p)});return [...new Set(out)]}

 <p class="hint" style="margin-bottom:1rem">Cấp tiểu học: sáng 4 tiết, chiều 3 tiết. Điền lớp vào từng ô (lịch cố định cả năm); tên bài phía dưới ô là gợi ý theo tuần đang xem, thầy vẫn sửa khi ghi nhật ký. ${notes.length?esc(notes[0])+' ':''}${cl.length?'':'Hãy thêm lớp ở mục Lớp học trước.'}</p>
 <div class="ttg"><div></div>${[2,3,4,5,6,7].map(d=>`<div class="h">Thứ ${d}</div>`).join('')}${['S','C'].map(b=>Array.from({length:PERIODS[b]},(_,i)=>`<div class="h" style="text-align:left">${BUOI_N[b]} ${i+1}</div>${[2,3,4,5,6,7].map(d=>cell(d,b,i)).join('')}`).join('')).join('')}</div></div>`}

function settingsAfter(){$$('[data-set]').forEach(i=>i.onchange=()=>{setSetting(i.dataset.set,i.value.trim());renderApp()});
 $$('[data-setn]').forEach(i=>i.onchange=()=>{const k=i.dataset.setn;setSetting(k,clamp(+i.value||0,1,k==='seats'?80:12));renderView(true)});
 $$('[data-seta]').forEach(i=>i.onchange=()=>{setSetting('aisle',parseAisleInput(i.value,S.settings.cols));renderView(true)});
 $$('[data-size]').forEach(i=>i.onchange=()=>{const c=get('classes',i.dataset.size);c.size=+i.value||'';put('classes',c)});
 $$('[data-tt]').forEach(s=>s.onchange=()=>{if(s.value)S.tt.slots[s.dataset.tt]=s.value;else delete S.tt.slots[s.dataset.tt];S.tt.mt=now();save();renderView(true)});
 const r=$('#reduceFx');if(r)r.onchange=()=>{localStorage.setItem('stps-reduce',r.checked?'1':'0');document.body.classList.toggle('reduce',r.checked)};
 const ts=$('#themeSeg');if(ts)ts.onclick=e=>{const b=e.target.closest('button');if(!b)return;localStorage.setItem('stps-theme',b.dataset.v);applyTheme();renderView(true)};
 const im=$('#imp007');if(im)im.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='ngoi-sao-lop-em'||!Array.isArray(d.classes))throw 0;const ys=[...new Set(d.classes.map(c=>c.year))].sort();const y=ys.includes(S.settings.year)?S.settings.year:ys.pop();let n=0;
   d.classes.filter(c=>c&&c.name&&(!c.year||c.year===y)&&!c.del).forEach(c=>{const size=(c.students||[]).filter(s=>s.status!=='left'&&!s.del).length;const ex=classList().find(x=>fold(x.name)===fold(c.name));if(ex){if(size){ex.size=size;put('classes',ex)}}else{addClass(c.name,size);n++}});toast(`Đã lấy ${n} lớp mới, cập nhật sĩ số (năm học ${y})`,'users');renderView(true)}catch(e){toast('Không đọc được tệp của Ngôi Sao Lớp Em','alert','#ff6b8b')}};
 const ri=$('#restoreIn');if(ri)ri.onchange=async e=>{const f=e.target.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(x){}if(!validData(d)){toast('Tệp sao lưu không hợp lệ','alert','#ff6b8b');return}
  if(!await confirmBox('Khôi phục dữ liệu?','Toàn bộ dữ liệu hiện tại trên máy này sẽ được thay bằng tệp sao lưu xuất lúc '+new Date(d.exported).toLocaleString('vi-VN')+'.','Khôi phục'))return;
  const b=blank();S={...b,settings:{...b.settings,...d.settings},tt:d.tt||b.tt,...Object.fromEntries(COLS.map(c=>[c,d[c]||{}]))};migrateRoom();S.settings.mt=now();S.tt.mt=now();await flush();cloudTouch();toast('Đã khôi phục dữ liệu','check');renderApp()}}
async function wipe(){if(!await confirmBox('Xoá toàn bộ dữ liệu?','Mọi tiết dạy, thiết bị, sự cố trên máy này sẽ mất. Không thể hoàn tác.','Xoá hết'))return;const keep=S.settings.teacher;S=blank();S.settings.teacher=keep;await flush();toast('Đã xoá dữ liệu','trash');show('welcome');renderWelcome()}
function backup(){download(`SaoLuu-SoTayPhongTinSo-${isoDate()}.json`,JSON.stringify(exportData('backup')),'application/json');S.settings.lastBackup=Date.now();save();toast('Đã tải tệp sao lưu','down');if(U.view==='settings')renderView(true)}
function guide(){modal('Hướng dẫn nhanh',`<ol class="steps"><li><b>Thiết lập phòng máy</b> một lần: số máy (mặc định 40 máy học sinh và 1 máy giáo viên), các bộ phận mỗi máy, thiết bị dùng chung. App tự tạo sổ kiểm kê.</li><li><b>Ghi tiết dạy</b> mỗi khi vào lớp: chọn lớp, bài dạy (có sẵn danh sách bài Tin học 3, 4, 5), số học sinh, tình trạng máy. Máy nào lỗi thì chạm vào máy đó trên sơ đồ. Ký một chạm bằng chữ ký đã lưu.</li><li><b>Sơ đồ phòng máy</b> cho biết ngay máy nào tốt, lỗi nhẹ, hỏng, đang sửa. Bấm vào một máy để xem từng bộ phận và lịch sử.</li><li><b>Kiểm kê tài sản</b>: nút <b>+</b> để ghi thiết bị mới nhận (ngày nhận, ngày ghi sổ tự lưu). Thiết bị hỏng có thể gửi sửa, sửa xong, thay mới hoặc thanh lý, lịch sử đều được giữ.</li><li><b>Báo cáo</b>: in sổ nhật ký đúng mẫu sổ giấy, biên bản kiểm kê, sổ theo dõi sửa chữa, hoặc xuất Excel.</li><li><b>Đồng bộ</b>: ở phòng Tin không có mạng thì xuất tệp ra USB, về nhà nhập vào bản trực tuyến để gộp. Khi có mạng, kết nối Google Drive để tự đồng bộ. Nhớ tải tệp sao lưu định kì.</li></ol>`,`<button class="btn pri" data-a="closeModal">Đã hiểu</button>`)}

/* ===== Điều khiển ===== */
function refresh(){if(U.screen==='app')renderApp();else if(U.screen==='welcome')renderWelcome();const d=$('#drawer');if(d&&U.mapSel!=null&&U.view==='map'&&!$('#modal'))seatDrawer(U.mapSel)}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg,'copy')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast(msg,'copy')}}
const ACT={
 enter:()=>{if(!S.settings.setup&&!live('assets').length){show('app');U.view='dash';renderApp();setupWizard();return}show('app');renderApp()},
 home:()=>{closeDrawer();show('welcome');renderWelcome()},guide,
 fullscreen:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})},
 closeModal:()=>closeModal(),closeDrawer,
 go:d=>{if(d.tab)U.setTab=d.tab;go(d.v)},
 setup:()=>setupWizard(),
 newLog:d=>newLog({cls:d.cls,b:d.b,p:d.p}),editLog:d=>editLog(d.id),delLog:d=>{closeModal();delLog(d.id)},
 lfSig:d=>{lfSync();if(d.v==='clear'){LF.sig='';renderLogForm()}else if(d.v==='default'){LF.sig='default';renderLogForm()}else{const keep=LF;sigPad((data,def)=>{LF=keep;if(def){setSetting('sig',data);LF.sig='default'}else LF.sig=data;renderLogForm()})}},
 lfShared:()=>{lfSync();const as=live('assets').filter(a=>!a.seat&&!a.retired);if(!as.length){toast('Chưa có thiết bị dùng chung trong sổ','alert','#ffc14d');return}LF.rows.push({seat:'_',aid:as[0].id,title:'',sev:'broken'});renderLogForm()},
 lfRowDel:d=>{lfSync();LF.rows.splice(+d.i,1);renderLogForm()},
 pickSeat:d=>pickSeat(d.n),
 signAll:async()=>{const ls=filteredLogs().filter(l=>!sigOf(l));if(!await confirmBox('Ký tất cả?',`Ký bằng chữ ký đã lưu cho ${ls.length} tiết chưa ký trong danh sách đang xem.`,'Ký','pri'))return;ls.forEach(l=>{l.sig='default';put('logs',l)});refresh();toast('Đã ký '+ls.length+' tiết','pen')},
 printLogs:()=>printLogs(),xlsLogs:()=>xlsLogs(),
 seat:d=>seatDrawer(d.n==='GV'?'GV':+d.n),toggleTilt:()=>{setSetting('tilt',!S.settings.tilt);renderView(true)},
 arrangeOn:()=>{U.arrange=true;U.arrSel=null;closeDrawer();go('map')},arrangeOff:()=>{U.arrange=false;U.arrSel=null;renderView(true);toast('Đã lưu bố trí sơ đồ')},
 arrangeReset:async()=>{if(!await confirmBox('Đặt lại sơ đồ mặc định?','Năm dãy dọc, mỗi dãy 8 máy (01–08 sát tường trái trong, rồi 09–16, 17–24, 25–32, 33–40). Lối đi sau dãy 1 và dãy 3. Máy giáo viên bên trái, cửa bên phải.','Đặt lại'))return;resetLayout();U.arrSel=null;renderView(true);toast('Đã đặt lại sơ đồ')},
 reportIssue:d=>reportIssue({aid:d.aid,seat:d.seat}),issue:d=>{closeModal();issueDrawer(d.id)},step:d=>stepDlg(d.id,d.t),delIssue:d=>delIssue(d.id),
 replace:d=>assetForm({replace:d.id}),
 asset:d=>assetDrawer(d.id),newAsset:d=>assetForm({seat:d.seat}),editAsset:d=>assetForm({id:d.id}),moveAsset:d=>moveAsset(d.id),retireAsset:d=>retireAsset(d.id),restoreAsset:d=>restoreAsset(d.id),delAsset:d=>delAsset(d.id),
 invCat:d=>{U.invCat=U.invCat===d.v?'':d.v;renderView(true)},invSt:d=>{U.invSt=d.v;renderView(true)},
 printInv,xlsInv,rpLogs:d=>rpLogs(d.k),rpFix:d=>rpFix(d.k),rpSet:d=>{U.rpFrom=d.f;U.rpTo=d.t;renderView(true)},
 setTab:d=>{U.setTab=d.v;renderView(true)},
 sigSet:()=>sigPad(data=>{setSetting('sig',data);toast('Đã lưu chữ ký','pen');renderView(true)}),sigDel:()=>{setSetting('sig','');renderView(true)},
 addClasses:()=>{const l=parseClassRange($('#clsAdd').value);if(!l.length)return;l.forEach(n=>addClass(n));toast('Đã thêm '+l.length+' lớp','users');renderView(true)},
 delClass:async d=>{const c=get('classes',d.id);const n=live('logs').filter(l=>l.cls===d.id).length;if(!await confirmBox('Xoá lớp '+esc(c.name)+'?',n?`Lớp này có ${n} tiết trong sổ, các tiết vẫn được giữ.`:'Lớp sẽ bị xoá khỏi danh sách.','Xoá'))return;del('classes',d.id);renderView(true)},
 ttClear:async()=>{if(!await confirmBox('Xoá thời khoá biểu?','Toàn bộ ô trong thời khoá biểu sẽ trống.','Xoá'))return;S.tt.slots={};S.tt.mt=now();save();renderView(true)},
 ttWeek:d=>{const n=yearWeeks().length||35;U.ttWeek=clamp((U.ttWeek||(currentTeachingWeek()||{w:1}).w)+(+d.v),1,n);renderView(true)},
 ttWeekNow:()=>{U.ttWeek=(currentTeachingWeek()||{w:1}).w;renderView(true)},
 backup,wipe,
 syncDlg,syncExport,saveDevName:()=>{DEV.name=$('#devName').value.trim();saveDevice();toast('Đã lưu tên máy')},
 cbTab:d=>{U.cbTab=d.v;syncDlg()},
 copyScript:d=>copyText(cloudScript(d.bk?DEV.draft2:DEV.draft),'Đã sao chép mã cầu nối, dán vào script.google.com'),
 urlConnect:async d=>{const u=$(d.bk?'#bkUrl':'#cuUrl').value.trim();if(!CLOUD_RE.test(u)){toast('URL chưa đúng, cần kết thúc bằng /exec','alert','#ffc14d');return}if(await cloudConnect({url:u,secret:d.bk?DEV.draft2:DEV.draft},!!d.bk))syncDlg()},
 codeConnect:async()=>{const c=parseCode($('#ccIn').value);if(!c){toast('Mã kết nối chưa đúng','alert','#ffc14d');return}if(await cloudConnect(c))syncDlg()},
 copyCode:()=>copyText(cloudCode(),'Đã sao chép mã kết nối'),
 cloudNow:()=>cloudSync(true),cloudBackup,
 cloudOff:async()=>{if(!await confirmBox('Ngắt kết nối Google Drive?','Dữ liệu trên máy và trên Drive vẫn giữ nguyên. Có thể kết nối lại bằng mã kết nối.','Ngắt'))return;delete DEV.cloud;delete DEV.cloud2;saveDevice();cloudSet('off');syncDlg()},
 bkOff:()=>{delete DEV.cloud2;saveDevice();syncDlg()}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(!f)return;e.preventDefault();e.stopPropagation();Promise.resolve(f({...el.dataset},el,e)).catch(err=>{console.error(err);toast('Có lỗi: '+err.message,'alert','#ff6b8b')})});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(!el)return;const k=el.dataset.ch;U[k]=el.value==='all'?'':el.value;renderView(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal'))closeModal();else if($('#drawer'))closeDrawer()}if(e.key==='Enter'&&U.screen==='welcome'&&!$('#modal'))ACT.enter()});
window.addEventListener('online',()=>{if(cloudOn())cloudSync()});window.addEventListener('offline',()=>{if(cloudOn())cloudSet('offline')});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();else if(cloudOn())cloudSync()});
window.addEventListener('pagehide',()=>flush());
function applyTheme(){const dark=localStorage.getItem('stps-theme')==='dark';document.body.classList.toggle('theme-dark',dark);document.body.classList.toggle('theme-light',!dark)}
(async function boot(){await loadAll();applyTheme();if(localStorage.getItem('stps-reduce')==='1')document.body.classList.add('reduce');renderWelcome();show('welcome');if(cloudOn()){CS.state='idle';setTimeout(()=>cloudSync(),1500)}setInterval(()=>{if(cloudOn()&&!cRun)cloudSync()},5*60e3);window.__ready=true})();
</script>
