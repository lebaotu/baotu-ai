<style>:root{--teal:#0e6a62;--teal2:#0a4f4a;--deep:#073b38;--ink:#123f3c;--muted:#5d7a73;--cream:#fff8ec;--paper:#fffdf7;--gold:#ffc23d;--gold2:#f19a1c;--orange:#ef7d3c;--rose:#e2566b;--green:#1f9d6b;--line:#e6dccb;--sky:#dff3ef;--r:1.1rem;--shadow:0 .5rem 1.6rem #0b3b3624}
*{box-sizing:border-box}
html{font-size:clamp(12px,calc(min(1vw,1.78vh)*.98),26px)}
@media (orientation:portrait){html{font-size:clamp(12px,3.65vw,24px)}}
html,body{margin:0;height:100%;background:#0b4743;color:var(--ink);font-family:'Segoe UI','Be Vietnam Pro',Roboto,Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none}
button:disabled{opacity:.45;cursor:default}
[hidden]{display:none!important}
:focus-visible{outline:.22rem solid var(--gold);outline-offset:.15rem}
svg{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border-radius:1rem;padding:.7rem 1.25rem;font-weight:800;font-size:1.05rem;white-space:nowrap;transition:transform .15s,filter .15s,box-shadow .15s;position:relative;user-select:none}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn svg{width:1.3em;height:1.3em;flex:none}
.primary{background:linear-gradient(145deg,#1a9487,#07665f);color:#fff9e9;border:2px solid #0a6862;box-shadow:0 .35rem 0 #064c48,0 .8rem 1.4rem #0c686738}
.primary:active:not(:disabled){box-shadow:0 .1rem 0 #064c48}
.warm{background:linear-gradient(145deg,#ffb347,#ef7d3c);color:#fff;border:2px solid #e07030;box-shadow:0 .35rem 0 #b9561f,0 .8rem 1.4rem #ef7d3c40;text-shadow:0 1px 0 #b9561f80}
.gold{background:linear-gradient(145deg,#ffe07a,#ffb51f);color:#5b3600;border:2px solid #eea51a;box-shadow:0 .35rem 0 #c47e08,0 .8rem 1.4rem #ffb51f40}
.danger{background:linear-gradient(145deg,#f17b8b,#d9435b);color:#fff;border:2px solid #c93a51;box-shadow:0 .35rem 0 #a42a3e}
.ghost{background:#fffdf6;color:#17605a;border:2px solid #cfe0d2;box-shadow:0 .3rem 0 #cfe0d2}
.ghost.on{background:#e4f6f0;border-color:#1a9487;box-shadow:0 .3rem 0 #1a9487}
.dark{background:#ffffff1c;color:#fff;border:2px solid #ffffff38;backdrop-filter:blur(6px)}
.sm{padding:.45rem .8rem;font-size:.9rem;border-radius:.8rem}
.lg{padding:1rem 1.8rem;font-size:1.35rem;border-radius:1.3rem}
.icon-btn{width:2.6rem;height:2.6rem;padding:0;border-radius:.9rem}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}

#welcome .mist{position:absolute;inset:0;background:linear-gradient(90deg,#fff8eefa 0%,#fff8eef0 34%,#fff6e690 50%,transparent 66%)}
#welcome .glow{position:absolute;width:40rem;height:40rem;left:-12rem;top:-14rem;border-radius:50%;background:radial-gradient(circle,#ffd98a66,transparent 65%);animation:pulse 7s ease-in-out infinite}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particles i{position:absolute;bottom:-3rem;width:var(--s);height:var(--s);animation:rise var(--d) linear infinite;animation-delay:var(--dl);opacity:.9}
.particles i svg{width:100%;height:100%;animation:spin 5s linear infinite}
.w-top{position:relative;z-index:2;display:flex;align-items:center;gap:1.1rem;padding:2rem 3rem 0}
.w-top img{width:5.4rem;height:5.4rem;border-radius:50%;box-shadow:0 .4rem 1rem #0b3b3630;background:#fff;animation:logoFloat 6s ease-in-out infinite}
.w-hero{position:relative;z-index:2;padding:2.6rem 3rem 0;max-width:46rem}
.eyebrow{font-size:.95rem;font-weight:800;letter-spacing:.22em;color:#c0782f;text-transform:uppercase}
.w-hero h1{margin:.9rem 0 .4rem;font-size:6.3rem;line-height:.98;letter-spacing:-.04em;font-weight:900;color:var(--teal2)}
.w-hero h1 em{display:block;font-style:normal;background:linear-gradient(100deg,#f4a019 0%,#ef6b3a 45%,#f4a019 90%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 .2rem 0 #fff)}
.w-line{height:.3rem;width:6rem;border-radius:1rem;background:linear-gradient(90deg,#c68b46,#ffd27a);margin:1.2rem 0}
.w-hero h2{font-size:1.65rem;margin:.2rem 0 .5rem;color:#164c47}
.w-hero p{font-size:1.2rem;line-height:1.6;color:#4f6d66;margin:.4rem 0 1.5rem;max-width:36rem}
.w-actions{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.w-actions .primary.lg{min-width:19rem;justify-content:space-between;font-size:1.6rem;padding:1.1rem 2rem}
.w-actions .primary.lg .arr{animation:nudge 1.4s ease-in-out infinite}
.w-note{margin-top:1rem;font-size:.92rem;color:#5b7069;display:flex;align-items:center;gap:.5rem}
.w-note svg{width:1.1rem;height:1.1rem;color:var(--teal)}
.w-tiles{position:absolute;z-index:2;left:3rem;right:3rem;bottom:4.2rem;display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.w-tile{background:#fffaf0e8;border:1px solid #ffffff;border-radius:1.2rem;padding:1rem 1.2rem;display:flex;gap:1rem;align-items:center;box-shadow:var(--shadow);backdrop-filter:blur(8px);animation:tileIn .8s both;animation-delay:var(--dl)}
.w-tile b{font-size:1.9rem;color:#c27a35;font-weight:900}
.w-tile small{display:block;color:#8a7a62;font-size:.85rem}
.w-tile span{font-weight:800;font-size:1.05rem;color:#164c47}
.w-foot{position:absolute;z-index:2;left:3rem;right:3rem;bottom:1.2rem;display:flex;justify-content:space-between;align-items:center;font-size:.95rem;color:#2c4d47}
.w-foot b{color:var(--teal2)}
.w-foot .row{display:flex;gap:.6rem}
.w-stats{position:absolute;z-index:2;right:3rem;top:2.2rem;display:flex;gap:.7rem}
.w-stat{background:#073b38c9;color:#fff;border-radius:1rem;padding:.6rem 1rem;text-align:center;backdrop-filter:blur(6px);min-width:6.4rem}
.w-stat b{display:block;font-size:1.6rem;color:var(--gold)}
.w-stat small{font-size:.8rem;opacity:.9}
.bubbles{position:absolute;right:4%;top:26%;width:40%;height:50%;z-index:1;pointer-events:none}
@media (orientation:portrait){
 #welcome .bg{inset:0;background-position:62% center;background-size:auto 46%;background-repeat:no-repeat;background-position:60% 100%}
 #welcome .mist{background:linear-gradient(180deg,#fff8eefa 0%,#fff8eef2 52%,#fff8ee60 68%,transparent 85%)}
 .w-top{padding:1.4rem 1.2rem 0;gap:.7rem}.w-top img{width:3.6rem;height:3.6rem}
 .w-hero{padding:1.6rem 1.2rem 0}.w-hero h1{font-size:3.9rem}.w-hero h2{font-size:1.25rem}.w-hero p{font-size:1rem}
 .w-actions .primary.lg{min-width:0;width:100%;font-size:1.35rem}
 .w-stats{position:relative;right:auto;top:auto;padding:0 1.2rem;margin-top:1rem}
 .w-tiles{display:none}
 .w-foot{left:1.2rem;right:1.2rem;bottom:.8rem;flex-direction:column;align-items:flex-start;gap:.5rem;background:#fff8eee0;padding:.6rem .8rem;border-radius:1rem}
 .bubbles{display:none}
}
/* ===== App shell ===== */
#app{flex-direction:column;background:radial-gradient(ellipse at 10% -10%,#1b8a7e 0%,transparent 45%),radial-gradient(ellipse at 100% 0%,#f3a64a40 0%,transparent 40%),linear-gradient(160deg,#0b4a45,#073532)}
.topbar{flex:none;display:flex;align-items:center;gap:1rem;padding:.7rem 1.3rem;color:#fff;position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0;cursor:pointer}
.brand img{width:3.1rem;height:3.1rem;border-radius:50%;background:#fff;box-shadow:0 0 0 .2rem #ffffff30}
.crumbs{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.1rem;min-width:0}
.crumbs .sep{opacity:.5}
.crumbs .cls{background:linear-gradient(145deg,#ffe07a,#ffb51f);color:#5b3600;padding:.3rem .9rem;border-radius:.8rem;font-size:1.3rem}
.spacer{flex:1}
.top-actions{display:flex;gap:.5rem;align-items:center}
.main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow:auto;padding:.4rem 1.3rem 1.3rem}
.panel{background:var(--paper);border-radius:1.4rem;box-shadow:var(--shadow);padding:1.3rem;border:1px solid #fff}
.h-title{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.h-title h2{margin:0;font-size:1.7rem;color:var(--teal2)}
.h-title p{margin:0;color:var(--muted)}
.banner{display:flex;gap:1rem;align-items:center;background:linear-gradient(90deg,#fff3d6,#ffe3b8);color:#6b4304;border-radius:1rem;padding:.7rem 1rem;margin-bottom:1rem;font-weight:650;border:1px solid #ffd58a}
.banner svg{width:1.6rem;height:1.6rem;flex:none}
.banner .spacer{flex:1}
.localnote{display:flex;gap:.5rem;align-items:center;color:#bfe7de;font-size:.9rem;margin:.6rem 0 0}
.localnote svg{width:1.1rem;height:1.1rem}
/* dashboard */
.dash-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:.2rem 0 1rem;color:#fff}
.dash-head h2{margin:0;font-size:1.9rem}
.sel{background:#fffdf6;border:2px solid #cfe0d2;border-radius:.9rem;padding:.5rem .8rem;font-weight:700;color:var(--teal2)}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tab{padding:.6rem 1.2rem;border-radius:1rem;font-weight:800;font-size:1.05rem;color:#d6f1ea;background:#ffffff14;border:2px solid #ffffff22;transition:.2s}
.tab.on{background:linear-gradient(145deg,#ffe07a,#ffb51f);color:#5b3600;border-color:#ffd24d;box-shadow:0 .3rem 0 #c47e08}
.tab:hover{filter:brightness(1.1)}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1.1rem}
.ccard{position:relative;text-align:left;background:var(--paper);border-radius:1.4rem;padding:1.1rem 1.2rem 1rem;box-shadow:var(--shadow);overflow:hidden;transition:transform .2s,box-shadow .2s;border:2px solid #fff;animation:popIn .45s both;animation-delay:var(--dl)}
.ccard:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 1rem 2rem #04221f55}
.ccard::before{content:"";position:absolute;right:-2.5rem;top:-2.5rem;width:8rem;height:8rem;border-radius:50%;background:var(--gc);opacity:.18}
.ccard .cname{font-size:2.3rem;font-weight:900;color:var(--gcd);letter-spacing:-.02em}
.ccard .cmeta{display:flex;gap:.9rem;color:var(--muted);font-size:.92rem;margin-top:.2rem;flex-wrap:wrap}
.ccard .faces{display:flex;margin-top:.8rem;height:2.6rem}
.ccard .faces .av{width:2.6rem;height:2.6rem;margin-right:-.7rem;border-radius:50%;background:#fff;box-shadow:0 0 0 .15rem #fff}
.ccard .cstar{position:absolute;right:1rem;top:1rem;display:flex;align-items:center;gap:.3rem;font-weight:900;color:#b87500;font-size:1.15rem}
.ccard .cstar svg{width:1.4rem;height:1.4rem}
.ccard .warn{position:absolute;right:1rem;top:2.9rem;background:#ffe4e8;color:#c0354c;border-radius:.7rem;padding:.15rem .5rem;font-size:.8rem;font-weight:800}
.ccard.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;background:#ffffff12;border:2px dashed #ffffff55;color:#e9fffa;font-weight:800;min-height:10rem;box-shadow:none}
.ccard.add svg{width:2.4rem;height:2.4rem}
.empty{color:#e8fbf6;text-align:center;padding:3rem 1rem}
.empty h3{font-size:1.6rem;margin:.5rem 0}
.empty .av-row{display:flex;justify-content:center;gap:.6rem;margin-bottom:1rem}
.empty .av-row .av{width:4.5rem;height:4.5rem}
/* class view */
.class-tabs{display:flex;gap:.5rem;padding:0 1.3rem .7rem;flex-wrap:wrap;align-items:center}
.lesson-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.lesson-bar{display:flex;gap:.8rem;align-items:center;padding:0 1.3rem .6rem;color:#fff;flex-wrap:wrap}
.lesson-bar .lname{font-size:1.3rem;font-weight:800}
.lesson-bar .ldate{opacity:.8}
.counter{display:flex;align-items:center;gap:.45rem;background:#ffffff1a;border:2px solid #ffffff30;border-radius:1rem;padding:.35rem .9rem;font-weight:900;font-size:1.3rem;color:var(--gold)}
.counter svg{width:1.6rem;height:1.6rem}
.counter.pop{animation:counterPop .5s}
.grid-area{flex:1;min-height:0;padding:0 1.3rem;overflow:auto}
.sgrid{display:grid;grid-template-columns:repeat(var(--cols,8),1fr);grid-auto-rows:var(--rowh,9rem);gap:var(--gap,.7rem);padding:.3rem 0 1rem}
.scard{position:relative;border-radius:1.2rem;background:linear-gradient(170deg,#fffef9,#fff3df);box-shadow:0 .3rem 0 #e3cfae,0 .6rem 1.1rem #0322204d;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:.3rem .3rem .45rem;overflow:hidden;transition:transform .18s,box-shadow .18s;border:2px solid #fff;animation:cardIn .5s both;animation-delay:var(--dl);text-align:center;min-width:0}
.scard:hover{transform:translateY(-3px) scale(1.02);z-index:2}
.scard .halo{position:absolute;left:50%;top:44%;width:84%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);opacity:.9}
.scard .avw{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.scard .avw .av{height:100%;max-width:100%;transform-origin:50% 100%;transform:scale(var(--grow,1))}
.scard .nm{position:relative;font-weight:900;font-size:var(--nmf,1.2rem);line-height:1.05;color:#123f3c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.scard .fn{position:relative;font-size:var(--fnf,.72rem);color:#6c7f78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.scard .pts{position:absolute;right:.35rem;top:.35rem;display:flex;align-items:center;gap:.15rem;background:linear-gradient(145deg,#ffe07a,#ffb51f);color:#5b3600;font-weight:900;border-radius:.8rem;padding:.08rem .45rem .08rem .25rem;font-size:var(--ptf,.95rem);box-shadow:0 .15rem 0 #c47e08}
.scard .pts svg{width:1em;height:1em}
.scard .neg{position:absolute;right:.35rem;top:2.05rem;background:#ffe4e8;color:#c0354c;font-weight:900;border-radius:.6rem;padding:0 .35rem;font-size:.75rem}
.scard .lv{position:absolute;left:.35rem;top:.35rem;font-size:.66rem;font-weight:900;color:#fff;background:var(--lvc);border-radius:.6rem;padding:.08rem .4rem;letter-spacing:.02em}
.scard .stt{position:absolute;left:.4rem;bottom:.3rem;font-size:.65rem;color:#a6987f;font-weight:700}
.scard.sel{box-shadow:0 0 0 .3rem var(--gold),0 .6rem 1.1rem #0322204d;transform:translateY(-2px)}
.scard .chk{position:absolute;inset:auto auto 2.1rem .35rem;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--teal);color:#fff;display:none;place-items:center}
.scard.sel .chk{display:grid}
.scard .chk svg{width:1rem;height:1rem}
.scard.absent{filter:grayscale(.95);opacity:.55}
.scard.absent::after{content:attr(data-abs);position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);background:#c0354c;color:#fff;font-weight:900;padding:.2rem .6rem;border-radius:.5rem;font-size:.8rem;white-space:nowrap}
.scard.bump{animation:bump .6s}
.scard.shake{animation:shake .5s}
.scard.called{box-shadow:0 0 0 .35rem #ef7d3c,0 0 2rem #ef7d3c}
.toolbar{flex:none;display:flex;gap:.6rem;padding:.7rem 1.3rem .9rem;align-items:center;flex-wrap:wrap;justify-content:center;background:linear-gradient(0deg,#062e2bcc,transparent)}
.toolbar .btn{font-size:1.02rem}
.selbar{position:absolute;left:50%;bottom:5.6rem;transform:translateX(-50%);background:#073b38;color:#fff;border-radius:1.2rem;padding:.6rem .7rem .6rem 1.2rem;display:flex;gap:.8rem;align-items:center;box-shadow:0 1rem 2rem #0007;z-index:5;font-weight:800;animation:popIn .3s}
/* avatar animations */
.av .bob{animation:bob 3.2s ease-in-out infinite;animation-delay:var(--ad,0s);transform-origin:60px 120px}
.av .eyes{animation:blink 5s infinite;animation-delay:var(--bd,0s);transform-origin:60px 60px}
.av .aura{animation:spin 9s linear infinite;transform-origin:60px 62px}
.av .crown{animation:crown 2.4s ease-in-out infinite;transform-origin:60px 20px}
.av .cape{animation:cape 2.6s ease-in-out infinite;transform-origin:60px 96px}
.reduce .av .bob,.reduce .av .eyes{animation:none}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#032220a6;backdrop-filter:blur(4px);animation:fade .2s;padding:1rem}
.mbox{background:var(--paper);border-radius:1.6rem;box-shadow:0 2rem 4rem #000a;max-width:min(64rem,96vw);width:100%;max-height:94vh;display:flex;flex-direction:column;animation:mIn .28s cubic-bezier(.2,1.4,.4,1)}
.mbox.narrow{max-width:min(36rem,96vw)}.mbox.wide{max-width:min(84rem,97vw)}
.mhead{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.4rem;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:1.5rem;color:var(--teal2);flex:1}
.mbody{padding:1.2rem 1.4rem;overflow:auto}
.mfoot{display:flex;gap:.7rem;justify-content:flex-end;padding:1rem 1.4rem;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem}
.field label{font-weight:750;color:#2d5650;font-size:.95rem}
.inp{border:2px solid #d9e4da;border-radius:.8rem;padding:.6rem .8rem;background:#fff;width:100%}
.inp:focus{border-color:#1a9487;outline:none}
textarea.inp{min-height:8rem;resize:vertical}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.row>.field{flex:1;min-width:10rem}
.hint{color:var(--muted);font-size:.88rem}
/* award popup */
.award-head{display:flex;gap:1.2rem;align-items:center}
.award-head .av{width:7rem;height:7.5rem}
.award-head h3{font-size:2rem;margin:0;color:var(--teal2)}
.award-head p{margin:.2rem 0 0;color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;margin-top:1rem}
.bh{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:1rem .6rem .8rem;border-radius:1.2rem;font-weight:800;font-size:1.05rem;transition:transform .15s;text-align:center;line-height:1.2}
.bh:hover{transform:translateY(-3px) scale(1.03)}
.bh .ic{width:3.4rem;height:3.4rem;border-radius:50%;display:grid;place-items:center;background:#fff}
.bh .ic svg{width:2rem;height:2rem}
.bh .pv{font-size:1.4rem;font-weight:900}
.bh.plus{background:linear-gradient(160deg,#e3f8ec,#c6efd8);color:#0e6a46;box-shadow:0 .3rem 0 #95d6b2}
.bh.plus .ic{color:#18a070}
.bh.minus{background:linear-gradient(160deg,#ffeef0,#ffd6dc);color:#a62a40;box-shadow:0 .3rem 0 #f0a8b4}
.bh.minus .ic{color:#d9435b}
.sec-t{font-weight:900;color:#2d5650;margin:1rem 0 0;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
/* fx */
.fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.fx .st{position:absolute;width:2.2rem;height:2.2rem;margin:-1.1rem 0 0 -1.1rem}
.fx .st svg{width:100%;height:100%}
.fx .float{position:absolute;font-weight:900;font-size:2.6rem;transform:translate(-50%,-50%);text-shadow:0 .2rem 0 #fff,0 .4rem 1rem #0005;animation:floatUp 1.2s ease-out forwards}
.fx .float.p{color:#18a070}.fx .float.m{color:#d9435b}
.fx .conf{position:absolute;width:.7rem;height:1rem;border-radius:.15rem}
.toast{position:fixed;left:50%;top:1.2rem;transform:translateX(-50%);z-index:95;background:#073b38;color:#fff;border-radius:1rem;padding:.8rem 1.3rem;font-weight:800;box-shadow:0 1rem 2rem #0007;display:flex;gap:.7rem;align-items:center;animation:toastIn .35s;max-width:90vw}
.toast svg{width:1.4rem;height:1.4rem;color:var(--gold)}
.levelup{position:fixed;inset:0;z-index:92;display:flex;align-items:center;justify-content:center;pointer-events:none}
.levelup .lu{background:radial-gradient(circle,#fff7dc,#ffe2a0);border-radius:2rem;padding:1.5rem 2.5rem;text-align:center;box-shadow:0 0 0 .4rem #ffc23d,0 2rem 4rem #0008;animation:luIn 2.6s forwards}
.levelup .av{width:12rem;height:13rem;margin:0 auto}
.levelup h3{margin:.3rem 0 0;font-size:2.2rem;color:#a85d00}
.levelup p{margin:.2rem 0 0;font-size:1.3rem;color:#5b3600;font-weight:700}
/* wheel */
.wheel-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:1.5rem;align-items:center}
.wheel-box{position:relative;aspect-ratio:1;width:100%;max-width:34rem;margin:auto}
.wheel-box canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 .6rem #fff,0 0 0 1rem #ffc23d,0 1.4rem 2.4rem #0005}
.wheel-box .pin{position:absolute;top:-1.4rem;left:50%;transform:translateX(-50%);width:2.6rem;height:3.4rem;filter:drop-shadow(0 .3rem .3rem #0005);z-index:2}
.wheel-box .hub{position:absolute;inset:41%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd15c 60%,#f19a1c);box-shadow:0 .3rem .8rem #0006;display:grid;place-items:center}
.wheel-box .hub svg{width:55%;height:55%}
.winner{text-align:center;min-height:20rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
.winner .av{width:13rem;height:14rem}
.winner h2{font-size:3rem;margin:.3rem 0;color:var(--teal2)}
.winner .wait{font-size:1.4rem;color:var(--muted)}
.winner.show .av{animation:winPop .7s cubic-bezier(.2,1.6,.4,1)}
/* timer */
.timer{position:fixed;right:1.3rem;bottom:6rem;z-index:40;background:#fffdf6;border-radius:1.6rem;box-shadow:0 1.2rem 2.4rem #0008;padding:1rem 1.2rem;width:22rem;border:3px solid #ffc23d;animation:popIn .3s}
.timer .tring{position:relative;width:11rem;height:11rem;margin:.3rem auto}
.timer .tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tval{position:absolute;inset:0;display:grid;place-items:center;font-size:2.8rem;font-weight:900;color:var(--teal2);font-variant-numeric:tabular-nums}
.timer.done{animation:flash .5s 6}
.timer .presets{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:.4rem 0}
.timer .head{display:flex;align-items:center;gap:.5rem;font-weight:900;color:var(--teal2)}
.timer.big{right:50%;bottom:50%;transform:translate(50%,50%);width:min(40rem,92vw)}
.timer.big .tring{width:24rem;height:24rem}.timer.big .tval{font-size:6rem}
/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.98rem}
.tbl th{position:sticky;top:0;background:#eef6ef;color:#2d5650;text-align:left;padding:.6rem .6rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;z-index:1;border-bottom:2px solid #d4e5d7}
.tbl td{padding:.45rem .6rem;border-bottom:1px solid #efe7d8;vertical-align:middle}
.tbl tr:hover td{background:#fffaf0}
.tbl .av{width:2.6rem;height:2.8rem}
.tbl .nmcell{display:flex;align-items:center;gap:.6rem;font-weight:750;white-space:nowrap}
.tbl .num{text-align:center;font-variant-numeric:tabular-nums}
.tbl textarea{width:100%;min-height:3.2rem;border:1.5px solid #e1e7dc;border-radius:.6rem;padding:.35rem .5rem;font-size:.88rem;resize:vertical;background:#fff}
.lvl{display:inline-block;padding:.2rem .6rem;border-radius:.6rem;font-weight:900;font-size:.85rem;white-space:nowrap}
.lvl.T{background:#d8f5e6;color:#0e6a46}.lvl.H{background:#e4effc;color:#2a5aa8}.lvl.C{background:#ffe1e6;color:#b02a42}
.lvsel{border-radius:.6rem;border:2px solid #d9e4da;padding:.25rem .4rem;font-weight:800;background:#fff}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{padding:.45rem .9rem;border-radius:1rem;background:#eef6ef;color:#2d5650;font-weight:800;border:2px solid transparent;font-size:.95rem}
.chip.on{background:#0e6a62;color:#fff;border-color:#0a4f4a;box-shadow:0 .25rem 0 #063a36}
.chip small{display:block;font-weight:600;font-size:.72rem;opacity:.8}
.sum-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin:1rem 0}
.sumc{border-radius:1.1rem;padding:.8rem 1rem;background:#f4f8f2}
.sumc b{display:block;font-size:2rem;font-weight:900}
.sumc.T{background:#d8f5e6;color:#0e6a46}.sumc.H{background:#e4effc;color:#2a5aa8}.sumc.C{background:#ffe1e6;color:#b02a42}.sumc.W{background:#fff1d6;color:#8a5600}
.warn-list{display:flex;flex-direction:column;gap:.5rem}
.warn-item{display:flex;gap:.7rem;align-items:center;background:#fff6e9;border-radius:.9rem;padding:.45rem .7rem;border:1px solid #ffe0ad;cursor:pointer}
.warn-item .av{width:2.4rem;height:2.6rem}
.warn-item.down{background:#fff0f2;border-color:#ffc6cf}
.two-col{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);gap:1rem;align-items:start}
.eval-grid{grid-template-columns:minmax(0,3.6fr) minmax(15rem,1fr)}
#evalTbl{font-size:.9rem}#evalTbl td{padding:.35rem .45rem}#evalTbl textarea{min-width:20rem}
/* leaderboard */
.lb-group{display:flex;flex-direction:column;gap:.8rem}
.lbg{display:grid;grid-template-columns:7rem 1fr 4.5rem;gap:.8rem;align-items:center;font-weight:900}
.lbg .bar{height:2.6rem;border-radius:1.3rem;background:#eef3ea;overflow:hidden;position:relative}
.lbg .bar i{position:absolute;inset:0 auto 0 0;border-radius:1.3rem;background:linear-gradient(90deg,var(--c1),var(--c2));width:0;transition:width 1.2s cubic-bezier(.2,1,.3,1);box-shadow:inset 0 -.3rem 0 #0002}
.lbg .bar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#fff3 0 .8rem,transparent .8rem 1.6rem);animation:stripes 1.2s linear infinite}
.lbg .gv{font-size:1.4rem;color:var(--teal2);text-align:right}
.lbi{display:flex;align-items:center;gap:.7rem;padding:.35rem .5rem;border-radius:.9rem;cursor:pointer}
.lbi:nth-child(1 of .lbi){background:#fff4cf}.lbi:nth-child(2 of .lbi){background:#f1f4f6}.lbi:nth-child(3 of .lbi){background:#fde9dc}
.lbi .rk{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#eef6ef;color:#2d5650}
.lbi .av{width:2.8rem;height:3rem}
.lbi b{flex:1}
.lbi .sc{font-weight:900;color:#b87500;display:flex;align-items:center;gap:.25rem}
.lbi .sc svg{width:1.1rem;height:1.1rem}
.badges{display:flex;flex-wrap:wrap;gap:.6rem}
.badge{display:flex;align-items:center;gap:.5rem;background:#fff;border-radius:1rem;padding:.35rem .8rem .35rem .35rem;box-shadow:0 .2rem .5rem #0001;border:1px solid #efe5d2;font-weight:800;font-size:.9rem}
.badge .md{width:2.4rem;height:2.4rem}
.badge-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4rem;padding:1rem;border-radius:1.2rem;background:#fffaf0;border:1px solid #f2e4c8}
.badge-card .md{width:4.6rem;height:4.6rem;animation:medal 4s ease-in-out infinite}
.badge-card b{color:var(--teal2)}
.badge-card small{color:var(--muted)}
.badge-card .who{display:flex;flex-wrap:wrap;justify-content:center;gap:.2rem}
.badge-card .who .av{width:2rem;height:2.2rem}
.bgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.8rem}
/* honor screen */
#honor{flex-direction:column;align-items:center;justify-content:flex-start;background:radial-gradient(ellipse at 50% 0%,#2aa392 0%,#0b4a45 45%,#052a27 100%);color:#fff;overflow:auto;z-index:60}
#honor .rays{position:absolute;left:50%;top:40%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(#ffffff0d 0 8deg,transparent 8deg 16deg);animation:spin 60s linear infinite;pointer-events:none}
.honor-top{position:relative;text-align:center;padding:1.2rem 1rem .2rem}
.honor-top .eyebrow{color:#ffd77a}
.honor-top h1{font-size:3.6rem;margin:.3rem 0;text-shadow:0 .3rem 0 #0004}
.honor-top p{margin:0;font-size:1.25rem;opacity:.9}
.podium{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:1.4rem;margin-top:1rem}
.pod{display:flex;flex-direction:column;align-items:center;width:15rem;animation:podIn .8s both;animation-delay:var(--dl)}
.pod .av{width:9.5rem;height:10.5rem}
.pod.p1 .av{width:12rem;height:13rem}
.pod .nm{font-size:1.6rem;font-weight:900;margin:.2rem 0;text-align:center}
.pod .bl{width:100%;border-radius:1.2rem 1.2rem 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:.5rem;font-weight:900;font-size:2.2rem;color:#5b3600;box-shadow:inset 0 -.6rem 0 #0002}
.pod.p1 .bl{height:8.5rem;background:linear-gradient(#ffe07a,#ffb51f)}
.pod.p2 .bl{height:6.5rem;background:linear-gradient(#f3f6f8,#c9d3da)}
.pod.p3 .bl{height:5.6rem;background:linear-gradient(#ffd3b0,#e7955e)}
.pod .bl small{font-size:1.1rem;display:flex;gap:.3rem;align-items:center}
.pod .bl small svg{width:1.2rem;height:1.2rem}
.honor-more{position:relative;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin:1rem 1rem .4rem;max-width:96rem}
.honor-card{max-width:40rem;background:#ffffff16;border:1px solid #ffffff30;border-radius:1.3rem;padding:1rem 1.3rem;min-width:18rem;backdrop-filter:blur(6px)}
.honor-card h4{margin:0 0 .6rem;color:#ffd77a;font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase}
.honor-card .badge{background:#ffffffe8;color:var(--ink)}
.maxim{position:relative;font-size:1.6rem;font-style:italic;color:#fff3cf;text-align:center;margin:.6rem 1rem 1rem;max-width:60rem;font-weight:600}
.honor-actions{position:relative;display:flex;gap:.8rem;margin-bottom:1.5rem;flex-wrap:wrap;justify-content:center}
/* profile */
.prof{display:grid;grid-template-columns:16rem minmax(0,1fr);gap:1.4rem}
.prof-side{text-align:center}
.prof-side .av{width:14rem;height:15rem;margin:0 auto}
.prof-side h2{margin:.2rem 0;font-size:1.7rem;color:var(--teal2)}
.lvbar{height:1rem;border-radius:1rem;background:#eef3ea;overflow:hidden;margin:.4rem 0}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd15c,#f19a1c);border-radius:1rem}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:.6rem;margin-bottom:1rem}
.stat{background:#f4f8f2;border-radius:1rem;padding:.6rem .8rem}
.stat b{display:block;font-size:1.6rem;color:var(--teal2)}
.stat small{color:var(--muted)}
.chart{width:100%;background:#fbfdf8;border-radius:1rem;border:1px solid #e5eee2}
.bars{display:flex;flex-direction:column;gap:.4rem}
.bars .bb{display:grid;grid-template-columns:10rem 1fr 2.5rem;gap:.5rem;align-items:center;font-size:.9rem}
.bars .bb .t{height:.9rem;border-radius:1rem;background:#eef3ea;overflow:hidden}
.bars .bb .t i{display:block;height:100%;border-radius:1rem}
.hist{max-height:14rem;overflow:auto;border:1px solid #efe7d8;border-radius:1rem}
.hist div{display:flex;gap:.6rem;padding:.35rem .7rem;border-bottom:1px solid #f3ecdf;font-size:.9rem;align-items:center}
.hist .p{color:#18a070;font-weight:900;width:2.5rem}.hist .m{color:#d9435b;font-weight:900;width:2.5rem}
.hist .d{color:var(--muted);width:6rem}
/* attendance mode */
.att-mode .scard{cursor:pointer}
.att-banner{position:absolute;left:50%;top:.2rem;transform:translateX(-50%);z-index:6;background:#ef7d3c;color:#fff;padding:.5rem 1.2rem;border-radius:1rem;font-weight:800;box-shadow:0 .5rem 1rem #0005}
/* lock */
#lock{z-index:80;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1a8a7d,#062f2c)}
.lockbox{background:var(--paper);border-radius:1.8rem;padding:2rem 2.4rem;text-align:center;box-shadow:0 2rem 4rem #000a;width:min(26rem,92vw)}
.lockbox img{width:5rem;height:5rem;border-radius:50%}
.pin-dots{display:flex;gap:.8rem;justify-content:center;margin:1rem 0}
.pin-dots i{width:1.1rem;height:1.1rem;border-radius:50%;background:#dfe7de}
.pin-dots i.f{background:var(--teal)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.pin-pad button{font-size:1.6rem;font-weight:900;padding:.8rem;border-radius:1rem;background:#f1f6ef;box-shadow:0 .25rem 0 #d3e0d2;color:var(--teal2)}
.lockbox.err{animation:shake .4s}
/* roster */
.roster-tools{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.status-left td{opacity:.5}
.pv-list{columns:3;font-size:.92rem;max-height:18rem;overflow:auto;background:#fbf8f1;border-radius:1rem;padding:.7rem 1rem}
.pv-list div{break-inside:avoid;padding:.1rem 0}
.drop{border:3px dashed #b9d4c4;border-radius:1.2rem;padding:1.4rem;text-align:center;background:#f6fbf6;color:#2d5650;font-weight:700;cursor:pointer}
.drop.over{background:#e4f6f0;border-color:#1a9487}
.settings-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.beh-row{display:grid;grid-template-columns:3rem 1fr 6rem 9rem 2.6rem;gap:.5rem;align-items:center;margin-bottom:.5rem}
.beh-row .ic{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:#eef6ef}
.beh-row .ic svg{width:1.6rem;height:1.6rem}
.sessions .ses{display:flex;gap:1rem;align-items:center;padding:.6rem .8rem;border-radius:1rem;background:#fff;border:1px solid #efe5d2;margin-bottom:.5rem}
.sessions .ses b{flex:1}
#printArea{display:none}
/* portrait */
@media (orientation:portrait){
 .topbar{padding:.6rem .8rem;gap:.5rem;flex-wrap:wrap}
 .brand img{width:2.6rem;height:2.6rem}
 .top-actions .btn .lbl{display:none}
 .view{padding:.3rem .7rem .8rem}
 .class-tabs{padding:0 .7rem .5rem;flex-wrap:nowrap;overflow-x:auto}
 .class-tabs .tab{padding:.5rem .8rem;font-size:.95rem;flex:none}
 .lesson-bar{padding:0 .7rem .5rem}
 .grid-area{padding:0 .7rem}
 .toolbar{padding:.5rem .5rem .7rem;gap:.4rem;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}
 .toolbar .btn{flex:none;font-size:.9rem;padding:.55rem .75rem}
 .two-col,.wheel-wrap,.prof{grid-template-columns:1fr}
 .sum-cards{grid-template-columns:repeat(2,1fr)}
 .podium{gap:.4rem}.pod{width:31vw}.pod .av{width:26vw;height:28vw}.pod.p1 .av{width:31vw;height:34vw}.pod .nm{font-size:1.05rem}
 .honor-top h1{font-size:2.3rem}
 .timer{right:.6rem;left:.6rem;width:auto;bottom:5rem}
 .beh-row{grid-template-columns:2.6rem 1fr 4.5rem 2.4rem}.beh-row .tsel{display:none}
 .pv-list{columns:1}
 .mbox{max-height:96vh}
 .award-head .av{width:5rem;height:5.4rem}.award-head h3{font-size:1.5rem}
 .bgrid{grid-template-columns:repeat(2,1fr)}
 .tbl{font-size:.85rem}
 .hide-p{display:none!important}
 .scard .stt{display:none}
 .scard .lv{font-size:0;width:.7rem;height:.7rem;padding:0;border-radius:50%;box-shadow:0 0 0 2px #fff}
 .w-note{background:#fff8eee8;padding:.4rem .7rem;border-radius:.8rem}
 .eval-grid{grid-template-columns:1fr!important}
}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.5%,1%)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}100%{transform:translateY(-110vh) translateX(var(--x));opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:-200% center}}
@keyframes nudge{50%{transform:translateX(.4rem)}}
@keyframes logoFloat{50%{transform:translateY(-.3rem) rotate(-3deg)}}
@keyframes tileIn{from{opacity:0;transform:translateY(1.5rem)}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}}
@keyframes cardIn{from{opacity:0;transform:translateY(1rem) scale(.9)}}
@keyframes bob{50%{transform:translateY(-3px) rotate(1.2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes crown{50%{transform:translateY(-2px) rotate(-4deg)}}
@keyframes cape{50%{transform:skewX(4deg)}}
@keyframes fade{from{opacity:0}}
@keyframes mIn{from{opacity:0;transform:scale(.9) translateY(1rem)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
@keyframes bump{30%{transform:scale(1.12) rotate(-2deg)}60%{transform:scale(.97)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes counterPop{40%{transform:scale(1.25)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-1rem)}}
@keyframes luIn{0%{opacity:0;transform:scale(.4) rotate(-8deg)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@keyframes winPop{from{transform:scale(.2) rotate(-20deg);opacity:0}}
@keyframes flash{50%{box-shadow:0 0 0 1rem #ef7d3c,0 1.2rem 2.4rem #0008}}
@keyframes stripes{to{background-position:1.6rem 0}}
@keyframes medal{50%{transform:rotate(6deg) translateY(-3px)}}
@keyframes podIn{from{opacity:0;transform:translateY(4rem)}}
@media print{
 @page{size:A4 landscape;margin:12mm}
 html,body{background:#fff!important;overflow:visible!important;height:auto;font-size:11pt}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important;color:#000;font-family:'Times New Roman',serif}
 #printArea .ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6mm}
 #printArea .ph img{width:18mm;height:18mm}
 #printArea h1{text-align:center;font-size:15pt;margin:2mm 0}
 #printArea h2{text-align:center;font-size:12pt;margin:0 0 4mm;font-weight:normal}
 #printArea table{width:100%;border-collapse:collapse;font-size:10pt;page-break-inside:auto}
 #printArea th,#printArea td{border:1px solid #444;padding:1.4mm 2mm;vertical-align:top}
 #printArea th{background:#eee}
 #printArea td:nth-child(2){white-space:nowrap}
 #printArea td:nth-child(7){white-space:nowrap}
 #printArea tr{page-break-inside:avoid}
 #printArea .pclass{page-break-after:always}
 #printArea .pclass:last-child{page-break-after:auto}
 #printArea .sig{display:flex;justify-content:space-between;margin-top:8mm;text-align:center}
 #printArea .sig div{width:40%}
}

/* School brand (giống website thhuynhngochue.edu.vn) */
.hnh{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;line-height:1.08;font-family:"Times New Roman",Times,"Noto Serif",Georgia,serif;text-transform:uppercase;white-space:nowrap;min-width:0}
.hnh1{font-size:.68em;font-weight:700;letter-spacing:.07em}
.hnh2{font-size:1em;font-weight:800;letter-spacing:.02em}
.w-top .hnh{font-size:2rem;color:#1d3b8f;text-shadow:0 1px 0 #fff,0 0 .6rem #fffbe9}
.brand .hnh{font-size:1.25rem;color:#fff;text-shadow:0 1px 2px #0005}
.brand .hnh1{color:#ffe6a3}
.w-auth{display:flex;flex-direction:column;gap:.15rem}
.w-addr{font-size:.82rem;opacity:.85;white-space:nowrap}
.greet h2{margin:0;font-size:1.9rem;line-height:1.15}
.greet small{display:block;font-size:1rem;opacity:.85;margin-top:.15rem;font-weight:600}
.proverb{position:relative;margin:1.2rem auto 1.4rem;max-width:40rem;padding:1.1rem 1.6rem 1rem 3.4rem;border-radius:1.2rem;background:linear-gradient(135deg,#fffaf0,#fdf0d6);color:#5a3a16;text-align:left;box-shadow:0 .6rem 1.6rem #00000026,inset 0 0 0 1px #e7c98c;animation:pvIn .7s cubic-bezier(.2,.8,.2,1) both}
.proverb .pq{position:absolute;left:.9rem;top:.1rem;font:700 4rem/1 Georgia,serif;color:#d39a35}
.proverb blockquote{margin:0;font:italic 600 1.3rem/1.5 Georgia,"Times New Roman","Noto Serif",serif}
.proverb figcaption{margin-top:.45rem;font-size:.9rem;font-weight:700;color:#a0702c;letter-spacing:.04em}
.proverb figcaption:before{content:"— "}
.proverb.slim{margin:0 0 1rem;max-width:none;padding:.6rem 1.2rem .6rem 2.8rem;display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
.proverb.slim .pq{font-size:2.8rem;left:.7rem;top:.05rem}
.proverb.slim blockquote{font-size:1.05rem}.proverb.slim figcaption{margin:0}
@keyframes pvIn{from{opacity:0;transform:translateY(.6rem) scale(.98)}to{opacity:1;transform:none}}
body.reduce .proverb{animation:none}
@media (max-width:700px){.w-top .hnh{font-size:1.35rem}.brand .hnh{font-size:1rem}.greet h2{font-size:1.45rem}.proverb{padding:.9rem 1rem .9rem 2.6rem}.proverb .pq{font-size:3rem;left:.6rem}.proverb blockquote{font-size:1.05rem}.w-addr{font-size:.7rem}}

.cdot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-left:.35rem;background:#9aa7a4;box-shadow:0 0 0 2px rgba(255,255,255,.7);vertical-align:middle}
.cdot[data-s="off"]{display:none}
.cstat .cdot[data-s="off"]{display:inline-block}
.cdot[data-s="ok"],.cdot[data-s="idle"]{background:#2fbf71}
.cdot[data-s="busy"]{background:#f2b632;animation:cpulse 1s ease-in-out infinite}
.cdot[data-s="offline"]{background:#9aa7a4}
.cdot[data-s="err"]{background:#e2574c}
@keyframes cpulse{50%{transform:scale(1.5);opacity:.6}}
.cstat{display:flex;align-items:center;gap:.5rem;margin:.2rem 0 .4rem;font-weight:800;color:#244a7a}
.cstat .cdot{margin:0;width:.8rem;height:.8rem}
.cstat[data-s="err"]{color:#b43b31}
.top-actions .btn .lbl+.cdot{margin-left:.35rem}

.bkbox{margin-top:1rem;padding-top:.9rem;border-top:2px dashed #c9defa}
.cstat[data-s="busy"]{color:#8a6a10}
</style>

function cloudSet(s,msg=''){CS.state=s;CS.msg=msg;cloudPaint()}
function cloudStatusText(){if(!cloudOn())return CS_TXT.off;let t=CS_TXT[CS.state]||'';if(CS.state==='ok'&&DEV.cloud.lastSync)t+=' lúc '+new Date(DEV.cloud.lastSync).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});if(CS.state==='err'&&CS.msg)t+=': '+CS.msg;if(CS.state==='err'&&CS.bk==='ok')t+=' (đã lưu vào tài khoản dự phòng)';return t}
function bkStatusText(){const b=DEV.cloud2;if(!b)return '';if(CS.bk==='err')return 'Tài khoản dự phòng chưa nhận được: '+(CS.bkMsg||'lỗi');if(CS.bk==='busy')return 'Đang gửi sang tài khoản dự phòng...';return b.lastSync?'Dự phòng đã nhận lúc '+new Date(b.lastSync).toLocaleString('vi-VN'):'Dự phòng đã kết nối'}
function cloudPaint(){const s=cloudOn()?CS.state:'off';$$('.cdot').forEach(d=>{d.dataset.s=s;d.title='Google Drive: '+cloudStatusText()});const st=$('#cloudStatus');if(st){st.dataset.s=s;st.querySelector('span').textContent=cloudStatusText()}const bs=$('#bkStatus');if(bs){const k=CS.bk==='err'?'err':CS.bk==='busy'?'busy':'ok';bs.dataset.s=k;bs.querySelector('.cdot').dataset.s=k;bs.querySelector('span').textContent=bkStatusText()}}
async function cloudCall(op,extra={},cfg){const c=cfg||DEV.cloud;const ac=new AbortController();const to=setTimeout(()=>ac.abort(),60000);
 try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:c.secret,op,device:DEV.id,...extra}),redirect:'follow',cache:'no-store',signal:ac.signal});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw new Error(r.status>=500?'Google đang gặp sự cố, app sẽ tự thử lại':/<html/i.test(t)?'cầu nối chưa mở quyền "Bất kỳ ai"':'phản hồi lạ từ Google')}
  if(!j.ok&&!j.conflict)throw new Error(j.err==='secret'?'mã bí mật không khớp':j.err==='data'?'dữ liệu không hợp lệ':(j.err||'lỗi từ Google'));return j}
 catch(e){if(e.name==='AbortError')throw new Error('Google phản hồi quá lâu');if(e instanceof TypeError)throw new Error(navigator.onLine?'không kết nối được tới cầu nối':'không có mạng');throw e}finally{clearTimeout(to)}}
function cloudTouch(){if(cloudMerging||!DEV)return;cloudGen++;if(!cloudOn())return;let ch=false;if(!DEV.cloud.pending){DEV.cloud.pending=true;ch=true}if(DEV.cloud2&&!DEV.cloud2.pending){DEV.cloud2.pending=true;ch=true}if(ch)saveDevice();cloudSchedule(8000)}
function cloudSchedule(ms){if(!cloudOn())return;clearTimeout(cloudT);cloudT=setTimeout(()=>cloudSync(),ms)}
function cloudChanged(s){return !!s&&(s.classesNew+s.studentsNew+s.studentsUpd+s.eventsNew+s.sessionsNew+s.sessionsUpd+s.evalsUpd+s.removed+s.settings)>0}
async function syncTarget(C){let got=null;
 for(let i=0;i<4;i++){const gen=cloudGen,pend=C.pending||C.lastRev==null;
  const p=await cloudCall('pull',{haveRev:C.lastRev||0},C);
  if(!p.same&&p.data){let d=null;try{d=JSON.parse(p.data)}catch(e){}
   if(d&&d.app==='ngoi-sao-lop-em'&&d.meta&&Array.isArray(d.classes)){cloudMerging=true;let s;try{s=mergeData(d)}finally{cloudMerging=false}await flush();if(cloudChanged(s))got=s;C.lastPullFrom=d.device?devLabel(d.device,d.deviceName):''}}
  if(!(C.pending||(pend&&M.classIds.length))){C.lastRev=p.rev;break}
  const r=await cloudCall('push',{baseRev:p.rev,data:JSON.stringify(buildSync(M.classIds.filter(id=>CL[id])))},C);
  if(r.conflict){C.lastRev=null;continue}
  C.lastRev=r.rev;if(cloudGen===gen)C.pending=false;break}
 C.lastSync=Date.now();return got}
async function cloudSync(manual){if(!cloudOn())return false;if(cloudRunning){cloudAgain=true;return cloudRunning}clearTimeout(cloudT);
 if(navigator.onLine===false){cloudSet('offline');if(manual)toast('Máy đang không có mạng. Dữ liệu vẫn lưu trên máy, sẽ tự đồng bộ khi có mạng.','alert');return false}
 cloudRunning=(async()=>{cloudSet('busy');let got=null,okP=false,errP=null;await flush();
  try{got=await syncTarget(DEV.cloud);okP=true}catch(e){errP=e}
  if(bkOn()){CS.bk='busy';cloudPaint();try{const g2=await syncTarget(DEV.cloud2);got=got||g2;CS.bk='ok';CS.bkMsg='';}catch(e){CS.bk='err';CS.bkMsg=e.message}}
  saveDevice();
  if(okP)cloudSet('ok');else cloudSet(navigator.onLine===false?'offline':'err',errP.message);
  try{if(got){if(U.screen==='app'&&!$('#modal'))renderApp();else if(U.screen==='welcome')renderWelcome();if(!manual)toast('Đã nhận dữ liệu mới từ Google Drive','sync')}}catch(e){console.error(e)}
  if(manual){if(okP)toast((got?'Đã đồng bộ, có dữ liệu mới từ máy khác':'Đã đồng bộ với Google Drive')+(CS.bk==='err'?'. Tài khoản dự phòng chưa nhận được.':''),CS.bk==='err'?'alert':'sync');else toast('Chưa đồng bộ được: '+errP.message+(CS.bk==='ok'?'. Đã lưu vào tài khoản dự phòng.':''),'alert')}
  cloudRunning=null;if(cloudAgain){cloudAgain=false;cloudSchedule(2000)}return okP})();return cloudRunning}
async function cloudBackup(){if(!cloudOn())return;if(navigator.onLine===false){toast('Máy đang không có mạng','alert');return}
 await flush();const data=JSON.stringify({app:'ngoi-sao-lop-em',v:1,exported:new Date().toISOString(),school:SCHOOL,meta:M,classes:M.classIds.map(id=>CL[id]).filter(Boolean)});
 toast('Đang sao lưu lên Google Drive...','upload');const T=[DEV.cloud].concat(bkOn()?[DEV.cloud2]:[]);const res=await Promise.all(T.map(C=>cloudCall('backup',{data},C).then(r=>{C.lastBackup=Date.now();C.lastBackupName=r.name;return r.name},e=>({err:e.message}))));
 const okN=res.filter(r=>typeof r==='string');saveDevice();
 if(okN.length){M.lastBackup=Date.now();M.reminderSnooze=0;saveMeta()}
 const msg=res.length===1?(okN.length?'Đã sao lưu: '+okN[0]:'Chưa sao lưu được: '+res[0].err):(okN.length===2?'Đã sao lưu vào cả hai tài khoản: '+okN[0]:res[0].err?'Tài khoản chính lỗi ('+res[0].err+'); đã sao lưu vào tài khoản dự phòng':(res[1].err?'Đã sao lưu tài khoản chính; tài khoản dự phòng lỗi: '+res[1].err:''));
 if(!okN.length&&res.length===2)toast('Chưa sao lưu được vào tài khoản nào: '+res[0].err,'alert');else toast(msg,okN.length===res.length?'check':'alert');
 if($('#modal')&&$('#cloudBox'))syncDlg();else if($('#modal')&&U.setTab==='data')settingsDlg('data')}
async function bkConnect(cfg){if(navigator.onLine===false){toast('Cần có mạng để kết nối','alert');return false}if(DEV.cloud&&cfg.url===DEV.cloud.url){toast('Đây là cầu nối của tài khoản chính. Hãy tạo cầu nối trong tài khoản Google thứ hai.','alert');return false}
 try{const r=await cloudCall('ping',{},cfg);DEV.cloud2={url:cfg.url,secret:cfg.secret,lastRev:null,pending:M.classIds.length>0,folder:r.folder,connected:Date.now()};delete DEV.cloudDraft2;saveDevice();toast('Đã kết nối tài khoản dự phòng, thư mục "'+r.folder+'"','check');return true}
 catch(e){toast('Chưa kết nối được tài khoản dự phòng: '+e.message,'alert');return false}}
async function bkRestore(){if(!bkOn())return;if(navigator.onLine===false){toast('Máy đang không có mạng','alert');return}
 toast('Đang lấy dữ liệu từ tài khoản dự phòng...','sync');try{const p=await cloudCall('pull',{haveRev:0},DEV.cloud2);if(!p.data){toast('Tài khoản dự phòng chưa có dữ liệu','alert');return}const d=JSON.parse(p.data);
  if(!d||d.app!=='ngoi-sao-lop-em'||!Array.isArray(d.classes))throw new Error('dữ liệu không hợp lệ');const sum=mergeData(d);await flush();DEV.cloud2.lastRev=p.rev;DEV.cloud.pending=true;saveDevice();
  closeModal(true);showMergeSummary(sum,d);if(U.screen==='app'&&U.view==='class'&&!CL[U.classId])U.view='dash';if(U.screen==='app')renderApp();cloudSchedule(1500)}
 catch(e){toast('Chưa khôi phục được: '+e.message,'alert')}}
async function cloudConnect(cfg){if(navigator.onLine===false){toast('Cần có mạng để kết nối lần đầu','alert');return}
 const btn=$('#btnCloudConnect');if(btn)btn.disabled=true;toast('Đang kiểm tra cầu nối...','sync');
 try{const r=await cloudCall('ping',{},cfg);DEV.cloud={url:cfg.url,secret:cfg.secret,on:true,lastRev:null,pending:M.classIds.length>0,folder:r.folder,connected:Date.now()};delete DEV.cloudDraft;saveDevice();toast('Đã kết nối thư mục "'+r.folder+'"','check');if(cfg.bk)await bkConnect(cfg.bk);await cloudSync(false);syncDlg()}
 catch(e){toast('Chưa kết nối được: '+e.message,'alert');if(btn)btn.disabled=false}}
function cloudBoxHTML(){const fmt=t=>t?new Date(t).toLocaleString('vi-VN'):'chưa có';
 if(cloudOn()){const c=DEV.cloud;return `<div class="panel" id="cloudBox" style="background:#f2f7ff;margin-top:1rem"><h3 style="margin:0 0 .3rem;color:var(--teal2)">3. Tự đồng bộ qua Google Drive (khi có mạng)</h3>
  <p class="cstat" id="cloudStatus" data-s="${CS.state}"><i class="cdot" data-s="${CS.state}"></i><span>${esc(cloudStatusText())}</span></p>
  <p class="hint" style="margin:.2rem 0 .7rem">Mở app là tự lấy dữ liệu mới, ghi điểm xong vài giây là tự gửi lên thư mục <b>${esc(c.folder||'007 - Ngôi Sao Lớp Em')}</b> (thư mục con "Đồng bộ tự động"; mỗi ngày tự giữ một bản trong "Sao lưu"). Mất mạng vẫn dùng bình thường, có mạng lại sẽ tự gửi.<br>Gửi lên gần nhất: <b>${fmt(c.lastSync)}</b>${c.pending?' (còn thay đổi chờ gửi)':''} · Sao lưu Drive gần nhất: <b>${fmt(c.lastBackup)}</b></p>
  <div class="row"><button class="btn primary" data-a="cloudNow" id="btnCloudNow">${IC.sync}Đồng bộ ngay</button><button class="btn gold" data-a="cloudBackup" id="btnCloudBackup">${IC.upload}Sao lưu lên Drive</button><button class="btn ghost" data-a="cloudShowCode">Mã kết nối cho máy khác</button><button class="btn ghost" data-a="cloudOff">Ngắt kết nối</button></div><div id="cloudCodeBox"></div>${bkBoxHTML()}</div>`}
 const dr=DEV.cloudDraft||'';return `<div class="panel" id="cloudBox" style="background:#f2f7ff;margin-top:1rem"><h3 style="margin:0 0 .3rem;color:var(--teal2)">3. Kết nối Google Drive để tự đồng bộ</h3>
 <p class="hint" style="margin:.2rem 0 .7rem">Làm một lần (khoảng 5 phút). Dữ liệu chỉ nằm trong Google Drive của thầy, trong thư mục "007 - Ngôi Sao Lớp Em". Không dùng dịch vụ lưu trữ nào khác.</p>
 <div class="row" style="gap:.6rem;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:16rem"><div class="sec-t">Máy đầu tiên</div>
 <ol class="hint" style="margin:.3rem 0 .6rem;padding-left:1.2rem;line-height:1.6"><li>Bấm <b>Lấy mã cầu nối</b> rồi <b>Sao chép</b>.</li><li>Mở <b>script.google.com</b>, Dự án mới, xóa hết, dán mã, Lưu.</li><li>Triển khai, Tùy chọn triển khai mới, loại <b>Ứng dụng web</b>: Thực thi với tư cách <b>Tôi</b>, Người có quyền truy cập <b>Bất kỳ ai</b>. Cho phép quyền truy cập Drive.</li><li>Sao chép <b>URL ứng dụng web</b> (đuôi /exec), dán vào ô dưới, bấm Kết nối.</li></ol>
 <button class="btn gold sm" data-a="cloudScriptShow">Lấy mã cầu nối</button><div id="gasBox"></div>
 <div class="row" style="margin-top:.6rem"><input class="inp" id="cloudUrl" style="flex:1" placeholder="https://script.google.com/macros/s/.../exec"><button class="btn primary sm" data-a="cloudConnectUrl" id="btnCloudConnect">Kết nối</button></div></div>
 <div style="flex:1;min-width:14rem"><div class="sec-t">Máy thứ hai trở đi (iPad, máy phòng Tin)</div><p class="hint" style="margin:.3rem 0 .6rem">Trên máy đã kết nối, bấm <b>Mã kết nối cho máy khác</b>, gửi mã sang máy này rồi dán vào đây.</p>
 <div class="row"><input class="inp" id="cloudCodeIn" style="flex:1" placeholder="NSLE1|... hoặc NSLE2|..."><button class="btn primary sm" data-a="cloudConnectCode">Kết nối</button></div></div></div></div>`}
function bkBoxHTML(){const b=DEV.cloud2;const head='<div class="bkbox" id="bkBox"><div class="sec-t">Tài khoản dự phòng'+(b?'':' (không bắt buộc)')+'</div>';
 if(b){const k=CS.bk==='err'?'err':CS.bk==='busy'?'busy':'ok';return head+`<p class="cstat" id="bkStatus" data-s="${k}"><i class="cdot" data-s="${k}"></i><span>${esc(bkStatusText())}</span></p>
 <p class="hint" style="margin:.2rem 0 .6rem">Mỗi lần gửi lên tài khoản chính, app gửi thêm một bản sang thư mục <b>${esc(b.folder||'007 - Ngôi Sao Lớp Em')}</b> của tài khoản Google thứ hai. Sao lưu hằng ngày và nút "Sao lưu lên Drive" cũng lưu vào cả hai. Khi tài khoản chính gặp sự cố, các máy vẫn đồng bộ qua tài khoản dự phòng.</p>
 <div class="row"><button class="btn gold sm" data-a="bkRestore" id="btnBkRestore">${IC.download}Khôi phục từ tài khoản dự phòng</button><button class="btn ghost sm" data-a="bkShowCode">Mã dự phòng cho máy khác</button><button class="btn ghost sm" data-a="bkOff">Ngắt dự phòng</button></div><div id="bkCodeBox"></div></div>`}
 return head+`<p class="hint" style="margin:.2rem 0 .5rem">Thêm một tài khoản Google thứ hai để giữ thêm một bản dữ liệu. Làm giống tài khoản chính nhưng <b>đăng nhập tài khoản thứ hai</b> khi mở script.google.com (nên mở cửa sổ ẩn danh). Cầu nối dự phòng tự tạo thư mục "007 - Ngôi Sao Lớp Em" trong tài khoản đó.</p>
 <div class="row" style="gap:.6rem;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:16rem"><button class="btn gold sm" data-a="bkScriptShow">Lấy mã cầu nối dự phòng</button><div id="gasBox2"></div>
 <div class="row" style="margin-top:.6rem"><input class="inp" id="bkUrl" style="flex:1" placeholder="Địa chỉ /exec của tài khoản dự phòng"><button class="btn primary sm" data-a="bkConnectUrl" id="btnBkConnect">Kết nối</button></div></div>
 <div style="flex:1;min-width:14rem"><p class="hint" style="margin:0 0 .4rem">Máy đã có dự phòng ở máy khác: dán <b>Mã dự phòng</b> (NSLB1|...) vào đây.</p><div class="row"><input class="inp" id="bkCodeIn" style="flex:1" placeholder="NSLB1|https://script.google.com/...|..."><button class="btn primary sm" data-a="bkConnectCode">Kết nối</button></div></div></div></div>`}
function cloudCopy(id){const t=$('#'+id);if(!t)return;t.select();const done=()=>toast('Đã sao chép','check');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t.value).then(done,()=>{document.execCommand('copy');done()});else{document.execCommand('copy');done()}}
Object.assign(ACT,{
 cloudNow:()=>cloudSync(true).then(()=>{if($('#cloudBox'))syncDlg()}),
 cloudBackup:()=>cloudBackup(),
 cloudScriptShow:()=>{if(!DEV.cloudDraft){DEV.cloudDraft=cloudSecret();saveDevice()}$('#gasBox').innerHTML=`<textarea class="inp" id="gasSrc" readonly rows="6" style="width:100%;margin-top:.5rem;font:12px/1.4 monospace">${esc(cloudScript(DEV.cloudDraft))}</textarea><button class="btn ghost sm" data-a="cloudCopy" data-t="gasSrc">Sao chép mã cầu nối</button>`},
 cloudCopy:d=>cloudCopy(d.t),
 cloudConnectUrl:()=>{const u=($('#cloudUrl').value||'').trim();if(!CLOUD_RE.test(u)){toast('Địa chỉ phải có dạng https://script.google.com/macros/s/.../exec','alert');return}if(!DEV.cloudDraft){toast('Hãy bấm "Lấy mã cầu nối" và dán mã đó vào Apps Script trước','alert');return}cloudConnect({url:u,secret:DEV.cloudDraft})},
 cloudConnectCode:()=>{const c=parseCloudCode($('#cloudCodeIn').value);if(!c){toast('Mã kết nối chưa đúng. Mã bắt đầu bằng NSLE1| hoặc NSLE2|','alert');return}cloudConnect(c)},
 cloudShowCode:()=>{$('#cloudCodeBox').innerHTML=`<p class="hint" style="margin:.7rem 0 .3rem">Gửi mã này sang iPad hoặc máy khác của thầy (AirDrop, Zalo cho chính mình), dán vào mục 3 bên máy đó.${bkOn()?' Mã này gồm cả tài khoản chính và tài khoản dự phòng.':''} Đừng chia sẻ mã cho người khác vì mã mở được dữ liệu lớp.</p><textarea class="inp" id="cloudCodeOut" readonly rows="2" style="width:100%;font:12px/1.4 monospace">${esc(cloudCode())}</textarea><button class="btn ghost sm" data-a="cloudCopy" data-t="cloudCodeOut">Sao chép mã kết nối</button>`},
 bkScriptShow:()=>{if(!DEV.cloudDraft2){DEV.cloudDraft2=cloudSecret();saveDevice()}$('#gasBox2').innerHTML=`<textarea class="inp" id="gasSrc2" readonly rows="6" style="width:100%;margin-top:.5rem;font:12px/1.4 monospace">${esc(cloudScript(DEV.cloudDraft2,true))}</textarea><button class="btn ghost sm" data-a="cloudCopy" data-t="gasSrc2">Sao chép mã cầu nối dự phòng</button>`},
 bkConnectUrl:async()=>{const u=($('#bkUrl').value||'').trim();if(!CLOUD_RE.test(u)){toast('Địa chỉ phải có dạng https://script.google.com/macros/s/.../exec','alert');return}if(!DEV.cloudDraft2){toast('Hãy bấm "Lấy mã cầu nối dự phòng" trước','alert');return}if(await bkConnect({url:u,secret:DEV.cloudDraft2})){await cloudSync(false);syncDlg()}},
 bkConnectCode:async()=>{const c=parseBkCode($('#bkCodeIn').value);if(!c){toast('Mã dự phòng chưa đúng. Mã bắt đầu bằng NSLB1|','alert');return}if(await bkConnect(c)){await cloudSync(false);syncDlg()}},
 bkShowCode:()=>{$('#bkCodeBox').innerHTML=`<p class="hint" style="margin:.6rem 0 .3rem">Dán mã này vào mục "Tài khoản dự phòng" trên iPad, iPhone, máy khác đã kết nối tài khoản chính. Đừng chia sẻ cho người khác.</p><textarea class="inp" id="bkCodeOut" readonly rows="2" style="width:100%;font:12px/1.4 monospace">${esc(bkCode())}</textarea><button class="btn ghost sm" data-a="cloudCopy" data-t="bkCodeOut">Sao chép mã dự phòng</button>`},
 bkRestore:async()=>{if(!(await confirmBox('Khôi phục từ tài khoản dự phòng','Lấy dữ liệu trong tài khoản dự phòng và GỘP vào máy này (không xóa gì trên máy). Sau đó dữ liệu sẽ được gửi lại lên tài khoản chính khi được.')))return;bkRestore()},
 bkOff:async()=>{if(!(await confirmBox('Ngắt tài khoản dự phòng','Máy này sẽ thôi gửi sang tài khoản dự phòng. Dữ liệu đã lưu ở đó vẫn giữ nguyên.')))return;DEV.cloud2=null;CS.bk='';saveDevice();syncDlg()},
 cloudOff:async()=>{if(!(await confirmBox('Ngắt kết nối Google Drive','Máy này sẽ thôi tự đồng bộ. Dữ liệu trên máy và trên Drive vẫn giữ nguyên.')))return;DEV.cloud=null;DEV.cloud2=null;CS.bk='';saveDevice();cloudSet('off');syncDlg()}
});
function cloudInit(){cloudPaint();if(cloudOn()){cloudSet(navigator.onLine===false?'offline':'idle');setTimeout(()=>cloudSync(),600)}
 addEventListener('online',()=>cloudSchedule(1500));addEventListener('offline',()=>{if(cloudOn())cloudSet('offline')});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')cloudSchedule(800)});
 setInterval(()=>{if(cloudOn()&&document.visibilityState==='visible'&&!cloudRunning)cloudSync()},120000);
 setInterval(()=>{if(cloudOn()&&(CS.state==='offline'||(CS.state==='err'&&DEV.cloud.pending)||(CS.bk==='err'&&DEV.cloud2&&DEV.cloud2.pending))&&navigator.onLine!==false&&!cloudRunning)cloudSync()},10000)}
</script>
